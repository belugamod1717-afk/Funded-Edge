<style>
:root{
  --bg:#0b0e11;
  --surface:#131820;
  --surface-2:#161c26;
  --line:#242b35;
  --line-2:#2f3846;
  --text:#e6ebf0;
  --text-dim:#a3aebd;
  --text-mute:#6b7787;
  --accent:#4a9eff;
  --accent-dim:#2f5f8f;
  --accent-bg:rgba(74,158,255,.08);
  --success:#4ade80;
  --gold:#e4b949;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
.container{max-width:960px;margin:0 auto;padding:0 24px}

/* Nav */
.nav{
  border-bottom:1px solid var(--line);
  background:rgba(11,14,17,.92);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:50;
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.3px;color:var(--text)}
.logo-mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#0b0e11;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.logo span{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:28px;font-size:14px}
.nav-links a{color:var(--text-dim);transition:color .15s}
.nav-links a:hover{color:var(--text)}
.nav-actions{display:flex;align-items:center;gap:10px}
.btn-ghost{padding:8px 14px;border-radius:6px;border:1px solid var(--line-2);color:var(--text-dim);font-size:13px;font-weight:500;transition:.15s}
.btn-ghost:hover{border-color:var(--accent-dim);color:var(--text)}
.btn-primary{padding:8px 14px;border-radius:6px;background:var(--accent);color:#0b0e11;font-size:13px;font-weight:600;transition:.15s;border:1px solid var(--accent)}
.btn-primary:hover{background:#5caaff;border-color:#5caaff}
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line-2);color:var(--text);font-size:13px;font-weight:500}
.user-chip:hover{border-color:var(--accent-dim)}
.user-initial{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#0b0e11;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}

/* Breadcrumb */
.breadcrumb{padding:20px 0 0;font-size:13px;color:var(--text-mute)}
.breadcrumb a{color:var(--text-mute);transition:color .15s}
.breadcrumb a:hover{color:var(--text-dim)}
.breadcrumb span{margin:0 8px;opacity:.5}

/* Firm header */
.firm-header{padding:32px 0 32px;border-bottom:1px solid var(--line)}
.firm-header-inner{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.firm-logo-lg{
  width:72px;height:72px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  font-size:22px;font-weight:700;color:var(--accent);
  letter-spacing:-.5px;
}
.firm-logo-lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px;background:#fff}
.firm-header-info{flex:1;min-width:0}
.firm-header-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-dim)}
.tag-neutral{background:transparent;color:var(--text-dim);border:1px solid var(--line-2)}
.firm-header-info h1{font-size:28px;line-height:1.15;letter-spacing:-.7px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge-verified{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:rgba(74,222,128,.12);color:var(--success);border:1px solid rgba(74,222,128,.25)}
.badge-unverified{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:transparent;color:var(--text-mute);border:1px solid var(--line-2)}
.firm-header-info p{color:var(--text-dim);font-size:14.5px;line-height:1.65;max-width:640px}

/* Actions row */
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn-lg{padding:10px 18px;border-radius:6px;font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid transparent}
.btn-lg.primary{background:var(--accent);color:#0b0e11;border-color:var(--accent)}
.btn-lg.primary:hover{background:#5caaff;border-color:#5caaff}
.btn-lg.secondary{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn-lg.secondary:hover{border-color:var(--accent-dim);background:var(--accent-bg)}
.btn-lg.save-active{background:var(--accent-bg);border-color:var(--accent-dim);color:var(--accent)}
.btn-lg:disabled{opacity:.5;cursor:wait}

/* Sections */
.section{padding:40px 0;border-bottom:1px solid var(--line)}
.section-head{margin-bottom:24px}
.section-head .kicker{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text-mute);margin-bottom:8px}
.section-head h2{font-size:20px;font-weight:600;letter-spacing:-.3px}

/* Rules grid */
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rule-cell{background:var(--surface);padding:16px}
.rule-k{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px}
.rule-v{font-size:15px;font-weight:600;color:var(--text);overflow-wrap:anywhere}

/* Ratings summary */
.rating-summary{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:24px}
@media (max-width:600px){.rating-summary{grid-template-columns:1fr;gap:20px;text-align:center}}
.rating-big{padding-right:32px;border-right:1px solid var(--line)}
@media (max-width:600px){.rating-big{padding:0 0 20px;border-right:0;border-bottom:1px solid var(--line)}}
.rating-big .num{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1;color:var(--text);margin-bottom:6px}
.rating-big .stars{color:var(--gold);font-size:14px;letter-spacing:1px;margin-bottom:4px}
.rating-big .count{font-size:12px;color:var(--text-mute)}
.rating-bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:32px 1fr 40px;gap:12px;align-items:center;font-size:12px}
.bar-row .lbl{color:var(--text-dim);font-weight:500}
.bar-row .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar-row .bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar-row .pct{color:var(--text-mute);text-align:right;font-weight:500}

/* Review item */
.review-item{padding:20px 0;border-bottom:1px solid var(--line)}
.review-item:last-child{border-bottom:0}
.review-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.review-author{display:flex;align-items:center;gap:12px;min-width:0}
.review-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--text-dim);flex-shrink:0}
.review-author-name{font-size:14px;font-weight:600;color:var(--text)}
.review-author-date{font-size:12px;color:var(--text-mute);margin-top:2px}
.review-stars{color:var(--gold);font-size:13px;letter-spacing:1px;flex-shrink:0}
.review-text{font-size:14px;color:var(--text-dim);line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}

/* Empty state */
.empty-block{padding:40px 20px;text-align:center;border:1px dashed var(--line-2);border-radius:10px;color:var(--text-dim);font-size:14px}
.empty-block .icon{font-size:28px;margin-bottom:12px;opacity:.4}
.empty-block strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px;font-weight:600}

/* Reviews actions */
.reviews-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.reviews-actions .btn-lg{flex:0 0 auto}

/* Loading */
.loading-block{padding:60px 20px;text-align:center;color:var(--text-mute);font-size:14px}

/* Info line */
.info-line{padding-top:20px;color:var(--text-mute);font-size:12.5px;line-height:1.6}

/* Footer */
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--text-mute);font-size:13px;margin-top:60px}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.footer-links{display:flex;gap:20px}
.footer-links a:hover{color:var(--text-dim)}

/* Responsive */
@media (max-width:700px){
  .nav-links{gap:16px;font-size:13px}
  .nav-links .hide-mobile{display:none}
  .container{padding:0 18px}
  .firm-header-info h1{font-size:22px}
  .firm-logo-lg{width:60px;height:60px;font-size:18px}
  .firm-logo-lg img{padding:8px}
  .section{padding:32px 0}
}
</style>
</head>

<script type="module">
import { db } from "./supabase.js";

const mainContent = document.getElementById("mainContent");
const crumbFirm = document.getElementById("crumbFirm");
const authArea = document.getElementById("feAuthArea");

let currentFirmId = null;
let currentUser = null;
let isFavorited = false;

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function safeUrl(value){
  try { const u = new URL(value); return ["http:","https:"].includes(u.protocol) ? u.href : ""; } catch { return ""; }
}
function getLogoDomain(firm){
  const name = (firm.name || "").toLowerCase().trim();
  const known = {"ftmo":"ftmo.com","the5ers":"the5ers.com","the 5ers":"the5ers.com","topstep":"topstep.com","apex trader funding":"apextraderfunding.com"};
  if (known[name]) return known[name];
  try { const u = new URL(firm.official_website || ""); if (u.protocol === "https:" || u.protocol === "http:") return u.hostname; } catch(_) {}
  return "";
}
function getInitials(name){
  const words = String(name || "PF").trim().split(/\s+/).filter(Boolean);
  return words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : (words[0] || "PF").slice(0,2).toUpperCase();
}
function logoURL(firm){
  const d = getLogoDomain(firm);
  return firm.logo_url || (d ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=128` : "");
}
function authUrl(mode){
  const next = location.pathname + location.search;
  const q = `?next=${encodeURIComponent(next)}`;
  return mode ? `/auth.html${q}&mode=${mode}` : `/auth.html${q}`;
}

let toastTimer;
function toast(msg){
  let el = document.getElementById("feToast");
  if (!el) {
    el = document.createElement("div");
    el.id = "feToast";
    el.style.cssText = "position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#131820;border:1px solid #242b35;color:#e6ebf0;padding:11px 16px;border-radius:8px;font-size:13.5px;z-index:9999;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4)";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3000);
}

async function syncAuthNav(){
  if (!authArea) return;
  try {
    const { data } = await db.auth.getSession();
    const user = data.session?.user;
    if (user && user.email_confirmed_at) {
      const name = user.user_metadata?.full_name || user.email || "Account";
      const initial = String(name).trim().charAt(0).toUpperCase() || "U";
      authArea.innerHTML = `<a class="user-chip" href="dashboard.html"><span class="user-initial">${esc(initial)}</span><span>Dashboard</span></a>`;
    } else {
      authArea.innerHTML = `<a class="btn-ghost" href="${authUrl("signin")}">Sign in</a><a class="btn-primary" href="${authUrl("signup")}">Get started</a>`;
    }
  } catch (err) { console.error(err); }
}

async function checkIfFavorited(){
  if (!currentUser || !currentFirmId) return false;
  const { data } = await db.from("favorites").select("id").eq("user_id", currentUser.id).eq("firm_id", currentFirmId).maybeSingle();
  return !!data;
}
function updateSaveButton(){
  const btn = document.getElementById("saveBtn");
  if (!btn) return;
  if (!currentUser) { btn.classList.remove("save-active"); btn.textContent = "Sign in to save"; }
  else if (isFavorited) { btn.classList.add("save-active"); btn.textContent = "Saved"; }
  else { btn.classList.remove("save-active"); btn.textContent = "Save firm"; }
}
async function toggleSave(){
  const btn = document.getElementById("saveBtn");
  if (!btn) return;
  if (!currentUser) { location.assign(authUrl("signin")); return; }
  btn.disabled = true;
  try {
    if (isFavorited) {
      const { error } = await db.from("favorites").delete().eq("user_id", currentUser.id).eq("firm_id", currentFirmId);
      if (error) throw error;
      isFavorited = false;
      toast("Removed from favorites");
    } else {
      const { error } = await db.from("favorites").insert({ user_id: currentUser.id, firm_id: currentFirmId });
      if (error) throw error;
      isFavorited = true;
      toast("Saved to favorites");
    }
    updateSaveButton();
  } catch (err) { console.error(err); toast("Could not update favorites"); }
  finally { btn.disabled = false; }
}

async function loadUser(){
  try {
    const { data: { user }, error } = await db.auth.getUser();
    if (error) currentUser = null;
    else if (user && user.email_confirmed_at) currentUser = user;
    else currentUser = null;
  } catch { currentUser = null; }
}

async function loadFirm(){
  const id = new URLSearchParams(location.search).get("id");
  if (!id) {
    mainContent.innerHTML = `<div class="empty-block"><strong>Firm not selected</strong>Return to the firms page and pick a firm.<br><br><a class="btn-lg secondary" href="firms.html" style="display:inline-flex">Back to firms</a></div>`;
    return;
  }

  try {
    const { data: firms, error } = await db.from("firms").select("*").eq("id", id).eq("status", "active").limit(1);
    if (error) throw error;
    if (!firms || !firms.length) {
      mainContent.innerHTML = `<div class="empty-block"><strong>Firm not found</strong>This firm may be inactive or unavailable.<br><br><a class="btn-lg secondary" href="firms.html" style="display:inline-flex">Back to firms</a></div>`;
      return;
    }

    const f = firms[0];
    currentFirmId = f.id;
    crumbFirm.textContent = f.name;

    document.title = `${f.name} — Rules, Pricing & Payouts | Firm Garage`;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", (f.description || `Full details on ${f.name}`).slice(0, 160));

    const logo = logoURL(f);
    const initials = getInitials(f.name);
    const official = safeUrl(f.official_website);
    const affiliate = safeUrl(f.affiliate_link);

    const verifiedBadge = f.verified
      ? `<span class="badge-verified">Verified</span>`
      : `<span class="badge-unverified">Unverified</span>`;

    mainContent.innerHTML = `
      <!-- Firm header -->
      <section class="firm-header">
        <div class="firm-header-inner">
          <div class="firm-logo-lg">
            <span>${esc(initials)}</span>
            ${logo ? `<img src="${esc(logo)}" alt="${esc(f.name)} logo" onerror="this.style.display='none'">` : ""}
          </div>
          <div class="firm-header-info">
            <div class="firm-header-tags">
              <span class="tag">${esc(f.category || "Prop Firm")}</span>
              ${f.tag ? `<span class="tag tag-neutral">${esc(f.tag)}</span>` : ""}
            </div>
            <h1>${esc(f.name)} ${verifiedBadge}</h1>
            <p>${esc(f.description || "Trading conditions and account options.")}</p>

            <div class="actions-row">
              <button class="btn-lg secondary" id="saveBtn" type="button">Save firm</button>
              ${official ? `<a class="btn-lg primary" href="${esc(official)}" target="_blank" rel="noopener noreferrer">Visit ${esc(f.name)} →</a>` : ""}
              ${affiliate ? `<a class="btn-lg secondary" href="${esc(affiliate)}" target="_blank" rel="noopener noreferrer">View offer</a>` : ""}
            </div>
          </div>
        </div>
      </section>

      <!-- Trading rules -->
      <section class="section">
        <div class="section-head">
          <div class="kicker">Account details</div>
          <h2>Trading rules &amp; conditions</h2>
        </div>
        <div class="rules-grid">
          <div class="rule-cell"><div class="rule-k">Account sizes</div><div class="rule-v">${esc(f.account_sizes || "—")}</div></div>
          <div class="rule-cell"><div class="rule-k">Starting price</div><div class="rule-v">${esc(f.price || "—")}</div></div>
          <div class="rule-cell"><div class="rule-k">Profit target</div><div class="rule-v">${esc(f.profit_target || "—")}</div></div>
          <div class="rule-cell"><div class="rule-k">Daily drawdown</div><div class="rule-v">${esc(f.daily_drawdown || "—")}</div></div>
          <div class="rule-cell"><div class="rule-k">Maximum drawdown</div><div class="rule-v">${esc(f.max_drawdown || "—")}</div></div>
          <div class="rule-cell"><div class="rule-k">Profit split</div><div class="rule-v">${esc(f.profit_split || "—")}</div></div>
          <div class="rule-cell"><div class="rule-k">Payout</div><div class="rule-v">${esc(f.payout || "—")}</div></div>
          <div class="rule-cell"><div class="rule-k">Platforms</div><div class="rule-v">${esc(f.platforms || "—")}</div></div>
        </div>
        <p class="info-line">Rules and pricing change — always verify on the firm's official website before purchasing.</p>
      </section>

      <!-- Reviews -->
      <section class="section" id="reviewsSection">
        <div class="section-head">
          <div class="kicker">Community</div>
          <h2>Reviews &amp; ratings</h2>
        </div>
        <div id="ratingSummary"></div>
        <div id="reviewsList"></div>
        <div class="reviews-actions">
          <a class="btn-lg secondary" id="viewAllReviewsBtn" href="#">View all reviews</a>
          <a class="btn-lg primary" id="writeReviewBtn" href="#">Write a review</a>
        </div>
      </section>
    `;

    document.getElementById("saveBtn").addEventListener("click", toggleSave);
    document.getElementById("viewAllReviewsBtn").href = `/reviews.html?id=${encodeURIComponent(f.id)}`;
    document.getElementById("writeReviewBtn").href = `/review.html?id=${encodeURIComponent(f.id)}`;

    await loadUser();
    isFavorited = await checkIfFavorited();
    updateSaveButton();

    await loadReviews();
  } catch (err) {
    console.error(err);
    mainContent.innerHTML = `<div class="empty-block"><strong>Could not load firm</strong>${esc(err.message)}</div>`;
  }
}

async function loadReviews(){
  const ratingWrap = document.getElementById("ratingSummary");
  const listWrap = document.getElementById("reviewsList");
  if (!ratingWrap || !listWrap) return;

  try {
    const { data: reviews, error } = await db
      .from("firm_reviews")
      .select("reviewer_name,rating,review_text,created_at")
      .eq("firm_id", currentFirmId)
      .eq("status", "approved")
      .order("created_at", { ascending: false });
    if (error) throw error;

    if (!reviews || !reviews.length) {
      ratingWrap.innerHTML = "";
      listWrap.innerHTML = `<div class="empty-block"><div class="icon">☆</div><strong>No reviews yet</strong>Be the first to share your experience with this firm.</div>`;
      return;
    }

    const total = reviews.length;
    const avg = reviews.reduce((s, r) => s + Number(r.rating || 0), 0) / total;
    const counts = [0,0,0,0,0];
    reviews.forEach(r => { const n = Math.max(1, Math.min(5, Number(r.rating) || 0)); counts[n-1]++; });
    const fullStars = "★".repeat(Math.round(avg)) + "☆".repeat(5 - Math.round(avg));

    ratingWrap.innerHTML = `
      <div class="rating-summary">
        <div class="rating-big">
          <div class="num">${avg.toFixed(1)}</div>
          <div class="stars">${fullStars}</div>
          <div class="count">${total} review${total === 1 ? "" : "s"}</div>
        </div>
        <div class="rating-bars">
          ${[5,4,3,2,1].map(star => {
            const c = counts[star-1];
            const pct = Math.round((c/total) * 100);
            return `<div class="bar-row"><span class="lbl">${star} ★</span><div class="bar"><span style="width:${pct}%"></span></div><span class="pct">${pct}%</span></div>`;
          }).join("")}
        </div>
      </div>`;

    const top3 = reviews.slice(0, 3);
    listWrap.innerHTML = top3.map(review => {
      const date = new Date(review.created_at);
      const dateText = Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      const rating = Math.max(1, Math.min(5, Number(review.rating) || 1));
      const name = review.reviewer_name || "Anonymous";
      const initials = name.trim().split(/\s+/).map(x => x[0]).slice(0,2).join("").toUpperCase();
      return `<article class="review-item">
        <div class="review-head">
          <div class="review-author">
            <div class="review-avatar">${esc(initials || "?")}</div>
            <div>
              <div class="review-author-name">${esc(name)}</div>
              <div class="review-author-date">${esc(dateText)}</div>
            </div>
          </div>
          <div class="review-stars">${"★".repeat(rating)}${"☆".repeat(5-rating)}</div>
        </div>
        <p class="review-text">${esc(review.review_text).replace(/\n/g, "<br>")}</p>
      </article>`;
    }).join("");
  } catch (err) {
    console.error(err);
    listWrap.innerHTML = `<div class="empty-block">Reviews could not be loaded.</div>`;
  }
}

syncAuthNav();
db.auth.onAuthStateChange(() => syncAuthNav());
loadFirm();
</script>
