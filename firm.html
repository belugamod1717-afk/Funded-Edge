<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prop Firm Details | FundedEdge</title>
<meta name="description" content="Full details on this prop firm: rules, pricing, account sizes, profit splits and trader reviews.">
<meta name="theme-color" content="#07110e">

<meta property="og:type" content="website">
<meta property="og:site_name" content="FundedEdge">
<meta property="og:title" content="Prop Firm Details | FundedEdge">
<meta property="og:description" content="Full details: rules, pricing, and trader reviews.">
<meta property="og:image" content="https://e-two.vercel.app/og-image.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Prop Firm Details | FundedEdge">
<meta name="twitter:description" content="Full details: rules, pricing, and trader reviews.">
<meta name="twitter:image" content="https://e-two.vercel.app/og-image.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#07110e;color:#edf7f0;font-family:Arial,sans-serif}
header{padding:20px 6%;border-bottom:1px solid #20372c;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header .brand{color:#54e39a;text-decoration:none;font-size:23px;font-weight:bold}
header nav{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header nav a{color:#cfe3d6;text-decoration:none;font-size:14px}
header nav a:hover{color:#54e39a}
main{max-width:900px;margin:35px auto;padding:20px}
.back{color:#65e5a1;text-decoration:none}
.card,.reviews-card{background:#101e17;border:1px solid #294535;border-radius:16px;padding:25px;margin-top:20px}
h1{font-size:32px;margin-bottom:10px}
h2{font-size:24px}
.muted{color:#a6b9ad;line-height:1.6}
.tag{display:inline-block;background:#193d2b;color:#70efa9;padding:7px 12px;border-radius:20px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:25px}
.item{background:#0a1510;padding:15px;border-radius:10px}
.label{color:#9cb1a3;font-size:13px;margin-bottom:8px}
.value{font-size:18px;font-weight:bold;overflow-wrap:anywhere}
.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:25px;align-items:center}
.btn{display:inline-block;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:bold;background:#54e39a;color:#07110e;border:1px solid transparent;cursor:pointer;font-size:15px}
.btn.secondary{background:#20372c;color:#eaf8ef}
.btn.save{
  background:transparent;
  color:#eaf8ef;
  border:1px solid #345442;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:.2s;
}
.btn.save:hover{border-color:#54e39a;color:#54e39a}
.btn.save.is-saved{
  background:rgba(84,227,154,.1);
  border-color:#54e39a;
  color:#54e39a;
}
.btn.save:disabled{opacity:.6;cursor:wait}
form{display:grid;gap:12px;margin:20px 0}
input,select,textarea{width:100%;padding:13px;border:1px solid #345442;border-radius:8px;background:#09150f;color:#edf7f0;font:inherit}
textarea{min-height:110px;resize:vertical}
button{padding:13px;border:0;border-radius:8px;background:#54e39a;color:#07110e;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.review{padding:16px 0;border-bottom:1px solid #294535}
.review:last-child{border-bottom:0}
.stars{color:#f6ca62;letter-spacing:2px}
.review-name{font-weight:bold}
.review-date{font-size:12px;color:#9cb1a3;margin-top:5px}
.review-text{line-height:1.6;overflow-wrap:anywhere}
#reviewMessage{color:#70efa9;line-height:1.5}
#reviewAuthPrompt{background:#0a1510;border:1px solid #294535;border-radius:12px;padding:18px;margin-top:20px;line-height:1.7}
a{overflow-wrap:anywhere}
[hidden]{display:none!important}

/* AUTH AREA in header nav */
.fe-auth-area{display:flex;align-items:center;gap:10px}
.fe-auth-area .fe-auth-signin,
.fe-auth-area .fe-auth-signup{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;
  text-decoration:none;transition:.2s;
}
.fe-auth-area .fe-auth-signin{
  background:transparent;color:#e0ece3;border:1px solid #2a4534;
}
.fe-auth-area .fe-auth-signin:hover{border-color:#54e39a;color:#54e39a}
.fe-auth-area .fe-auth-signup{
  background:#54e39a;color:#07110e;border:1px solid #54e39a;
}
.fe-auth-area .fe-auth-signup:hover{background:#7ff0b6;border-color:#7ff0b6}
.fe-auth-area .fe-user-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border:1px solid #2a4534;border-radius:10px;
  color:#e0ece3;font-weight:600;font-size:13px;text-decoration:none;
  background:rgba(84,227,154,.08);transition:.2s;
}
.fe-auth-area .fe-user-chip:hover{border-color:#54e39a;color:#54e39a}
.fe-auth-area .fe-user-initial{
  width:22px;height:22px;display:grid;place-items:center;
  border-radius:50%;background:#54e39a;color:#07110e;
  font-weight:800;font-size:11px;
}

/* TOAST */
#feToast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:#163a27;border:1px solid #2f8a56;color:#c8f5d8;
  padding:12px 18px;border-radius:10px;font-size:14px;
  z-index:9999;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4);
}

@media(max-width:700px){
  header{padding:16px 5%}
  .fe-auth-area{gap:6px}
  .fe-auth-area .fe-auth-signin,
  .fe-auth-area .fe-auth-signup,
  .fe-auth-area .fe-user-chip{padding:8px 10px;font-size:12px}
}
@media(max-width:500px){main{padding:14px}.card,.reviews-card{padding:18px}h1{font-size:27px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">FundedEdge</a>
  <nav>
    <a href="/directory.html">Prop Firms</a>
    <a href="/compare.html">Compare</a>
    <div id="feAuthArea" class="fe-auth-area">
      <a class="fe-auth-signin" href="/auth.html?mode=signin">Sign In</a>
      <a class="fe-auth-signup" href="/auth.html?mode=signup">Sign Up</a>
    </div>
  </nav>
</header>

<main>
<a class="back" href="/directory.html">← Back to directory</a>

<div class="card" id="content">
<p class="muted">Loading firm details...</p>
</div>

<section class="reviews-card" id="reviewsSection" hidden>
<h2>Reviews &amp; Ratings</h2>
<p class="muted">Read community experiences or share your own. All submitted reviews require approval.</p>

<div id="reviewAuthPrompt" hidden></div>

<form id="reviewForm" hidden>
<label for="reviewerName">Your name</label>
<input id="reviewerName" name="reviewerName" maxlength="40" minlength="2" required placeholder="Enter your name">

<label for="reviewRating">Your rating</label>
<select id="reviewRating" name="reviewRating" required>
<option value="">Choose stars</option>
<option value="5">★★★★★ — 5 stars</option>
<option value="4">★★★★ — 4 stars</option>
<option value="3">★★★ — 3 stars</option>
<option value="2">★★ — 2 stars</option>
<option value="1">★ — 1 star</option>
</select>

<label for="reviewText">Your review</label>
<textarea id="reviewText" name="reviewText" minlength="10" maxlength="1000" required placeholder="Share your experience (10–1000 characters)"></textarea>

<button id="reviewSubmit" type="submit">Submit Review</button>
<p class="muted">Be honest and respectful. Never include passwords or private information.</p>
<p id="reviewMessage" role="status"></p>
</form>

<div id="reviewsList">
<p class="muted">Loading reviews...</p>
</div>
</section>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://mvltzznwdglwaedfzxze.supabase.co";
const SUPABASE_KEY = "sb_publishable_6Z18S8P-DzDiBcl_EwRuZQ_nrq_8hid";
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const content = document.getElementById("content");
const reviewsSection = document.getElementById("reviewsSection");
const reviewForm = document.getElementById("reviewForm");
const reviewAuthPrompt = document.getElementById("reviewAuthPrompt");
const reviewMessage = document.getElementById("reviewMessage");
const reviewsList = document.getElementById("reviewsList");
const reviewSubmit = document.getElementById("reviewSubmit");
const reviewerNameInput = document.getElementById("reviewerName");
const authArea = document.getElementById("feAuthArea");

let currentFirmId = null;
let currentUser = null;
let isFavorited = false;

/* ---------- HELPERS ---------- */
function esc(value) {
  return String(value ?? "Not provided").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function safeUrl(value) {
  try {
    const u = new URL(value);
    return ["http:", "https:"].includes(u.protocol) ? u.href : "";
  } catch {
    return "";
  }
}

function item(label, value) {
  return `<div class="item"><div class="label">${esc(label)}</div>
  <div class="value">${esc(value || "Not provided")}</div></div>`;
}

function authUrl(mode) {
  const next = location.pathname + location.search;
  const q = `?next=${encodeURIComponent(next)}`;
  return mode ? `/auth.html${q}&mode=${mode}` : `/auth.html${q}`;
}

/* ---------- TOAST ---------- */
let toastTimer;
function toast(msg) {
  let el = document.getElementById("feToast");
  if (!el) {
    el = document.createElement("div");
    el.id = "feToast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3500);
}

/* ---------- AUTH NAV ---------- */
function renderAuthArea() {
  if (!authArea) return;

  if (currentUser) {
    const name =
      currentUser.user_metadata?.full_name ||
      currentUser.user_metadata?.name ||
      currentUser.email ||
      "Account";
    const initial = String(name).trim().charAt(0).toUpperCase() || "U";

    authArea.innerHTML = `
      <a class="fe-user-chip" href="/dashboard.html">
        <span class="fe-user-initial">${esc(initial)}</span>
        <span>Dashboard</span>
      </a>`;
  } else {
    authArea.innerHTML = `
      <a class="fe-auth-signin" href="${authUrl("signin")}">Sign In</a>
      <a class="fe-auth-signup" href="${authUrl("signup")}">Sign Up</a>`;
  }
}

/* ---------- FAVORITES ---------- */
async function checkIfFavorited() {
  if (!currentUser || !currentFirmId) return false;

  const { data, error } = await db
    .from("favorites")
    .select("id")
    .eq("user_id", currentUser.id)
    .eq("firm_id", currentFirmId)
    .maybeSingle();

  if (error) {
    console.error("Favorite check failed:", error);
    return false;
  }

  return !!data;
}

function updateSaveButton() {
  const btn = document.getElementById("saveBtn");
  if (!btn) return;

  if (!currentUser) {
    btn.classList.remove("is-saved");
    btn.innerHTML = `♡ Sign in to save`;
    btn.dataset.mode = "signin";
  } else if (isFavorited) {
    btn.classList.add("is-saved");
    btn.innerHTML = `♥ Saved`;
    btn.dataset.mode = "remove";
  } else {
    btn.classList.remove("is-saved");
    btn.innerHTML = `♡ Save firm`;
    btn.dataset.mode = "add";
  }
}

async function toggleSave() {
  const btn = document.getElementById("saveBtn");
  if (!btn) return;

  if (!currentUser) {
    location.assign(authUrl("signin"));
    return;
  }

  btn.disabled = true;

  try {
    if (isFavorited) {
      const { error } = await db
        .from("favorites")
        .delete()
        .eq("user_id", currentUser.id)
        .eq("firm_id", currentFirmId);

      if (error) throw error;

      isFavorited = false;
      toast("Removed from favorites");
    } else {
      const { error } = await db
        .from("favorites")
        .insert({
          user_id: currentUser.id,
          firm_id: currentFirmId
        });

      if (error) throw error;

      isFavorited = true;
      toast("Saved to favorites");
    }

    updateSaveButton();
  } catch (error) {
    console.error("Favorite toggle failed:", error);
    toast("Could not update favorites. Try again.");
  } finally {
    btn.disabled = false;
  }
}

/* ---------- REVIEWS ACCESS ---------- */
function updateReviewAccess() {
  if (currentUser) {
    reviewForm.hidden = false;
    reviewAuthPrompt.hidden = true;

    const fullName = currentUser.user_metadata?.full_name;
    const emailName = currentUser.email?.split("@")[0] || "";

    if (!reviewerNameInput.value) {
      reviewerNameInput.value = fullName || emailName;
    }
  } else {
    reviewForm.hidden = true;
    reviewAuthPrompt.hidden = false;
    reviewAuthPrompt.innerHTML = `
      <strong>Sign in to share your experience</strong>
      <p class="muted">You need an account with a verified email address to submit a rating or review. You can still read published reviews without signing in.</p>
      <a class="btn" href="${esc(authUrl())}">Sign In / Create Account</a>
    `;
  }

  renderAuthArea();
}

async function checkUser() {
  try {
    const { data: { user }, error } = await db.auth.getUser();

    if (error) {
      currentUser = null;
    } else if (user && user.email_confirmed_at) {
      currentUser = user;
    } else {
      currentUser = null;
    }
  } catch (error) {
    console.error("Account check failed:", error);
    currentUser = null;
  }

  updateReviewAccess();
}

/* ---------- LOAD FIRM ---------- */
async function loadFirm() {
  const id = new URLSearchParams(location.search).get("id");

  if (!id) {
    content.innerHTML = '<h1>Firm not selected</h1><p class="muted">Return to the directory and select a firm.</p>';
    renderAuthArea();
    return;
  }

  try {
    const { data: firms, error } = await db
      .from("firms")
      .select("*")
      .eq("id", id)
      .eq("status", "active")
      .limit(1);

    if (error) throw error;

    if (!firms || !firms.length) {
      content.innerHTML = '<h1>Firm not found</h1><p class="muted">This firm may be inactive or unavailable.</p>';
      renderAuthArea();
      return;
    }

    const f = firms[0];
    currentFirmId = f.id;
    const official = safeUrl(f.official_website);
    const affiliate = safeUrl(f.affiliate_link);

    content.innerHTML = `
      <span class="tag">${esc(f.category || "Prop Firm")}</span>
      <h1>${esc(f.name)}</h1>
      <p class="muted">${esc(f.description || "No description has been added yet.")}</p>
      ${f.tag ? `<span class="tag">${esc(f.tag)}</span>` : ""}
      <div class="grid">
        ${item("Account sizes", f.account_sizes)}
        ${item("Starting price", f.price)}
        ${item("Profit target", f.profit_target)}
        ${item("Daily drawdown", f.daily_drawdown)}
        ${item("Maximum drawdown", f.max_drawdown)}
        ${item("Profit split", f.profit_split)}
        ${item("Payout", f.payout)}
        ${item("Trading platforms", f.platforms)}
        ${item("Listed rating", f.rating ? f.rating + " / 5" : "Not rated")}
      </div>
      <div class="buttons">
        <button class="btn save" id="saveBtn" type="button">♡ Save firm</button>
        ${official ? `<a class="btn" href="${esc(official)}" target="_blank" rel="noopener noreferrer">Official Website ↗</a>` : ""}
        ${affiliate ? `<a class="btn secondary" href="${esc(affiliate)}" target="_blank" rel="noopener noreferrer">View Offer ↗</a>` : ""}
      </div>
      <p class="muted">Please verify current rules and prices on the firm's official website before purchasing.</p>
    `;

    document.getElementById("saveBtn").addEventListener("click", toggleSave);

    reviewsSection.hidden = false;
    await checkUser();

    isFavorited = await checkIfFavorited();
    updateSaveButton();

    await loadReviews();
  } catch (error) {
    console.error(error);
    content.innerHTML = `<h1>Unable to load firm</h1><p id="error">${esc(error.message)}</p><p class="muted">Check your connection and try again.</p>`;
    renderAuthArea();
  }
}

/* ---------- LOAD REVIEWS ---------- */
async function loadReviews() {
  reviewsList.innerHTML = '<p class="muted">Loading reviews...</p>';

  try {
    const { data: reviews, error } = await db
      .from("firm_reviews")
      .select("reviewer_name,rating,review_text,created_at")
      .eq("firm_id", currentFirmId)
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!reviews || !reviews.length) {
      reviewsList.innerHTML = '<p class="muted">No published reviews yet. Be the first to share your experience!</p>';
      return;
    }

    const average = reviews.reduce((sum, review) => sum + Number(review.rating), 0) / reviews.length;

    reviewsList.innerHTML = `
      <div class="item">
        <div class="label">Community rating from published reviews</div>
        <div class="value"><span class="stars">★</span> ${average.toFixed(1)} / 5</div>
        <p class="muted">${reviews.length} published review${reviews.length === 1 ? "" : "s"}</p>
      </div>
      ${reviews.map(review => {
        const date = new Date(review.created_at);
        const dateText = Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString();
        const rating = Math.max(1, Math.min(5, Number(review.rating) || 1));

        return `
          <article class="review">
            <div class="review-name">${esc(review.reviewer_name)}</div>
            <div class="stars" aria-label="${rating} out of 5 stars">${"★".repeat(rating)}${"☆".repeat(5-rating)}</div>
            <p class="review-text">${esc(review.review_text).replace(/\n/g, "<br>")}</p>
            <div class="review-date">${esc(dateText)}</div>
          </article>
        `;
      }).join("")}
    `;
  } catch (error) {
    console.error("Review loading failed:", error);
    reviewsList.innerHTML = '<p class="muted">Reviews could not be loaded. Please refresh the page and try again.</p>';
  }
}

/* ---------- REVIEW SUBMIT ---------- */
reviewForm.addEventListener("submit", async event => {
  event.preventDefault();

  if (!currentFirmId) return;

  reviewSubmit.disabled = true;
  reviewMessage.textContent = "Checking your account...";

  try {
    const { data: { user }, error: userError } = await db.auth.getUser();

    if (userError || !user || !user.email_confirmed_at) {
      currentUser = null;
      updateReviewAccess();
      throw new Error("Please sign in with a verified email address before submitting a review.");
    }

    currentUser = user;

    const reviewerName = reviewerNameInput.value.trim();
    const rating = Number(document.getElementById("reviewRating").value);
    const reviewText = document.getElementById("reviewText").value.trim();

    if (reviewerName.length < 2 || rating < 1 || rating > 5 ||
        reviewText.length < 10 || reviewText.length > 1000) {
      throw new Error("Please check your name, rating, and review length.");
    }

    reviewMessage.textContent = "Submitting your review...";

    const { error } = await db.from("firm_reviews").insert({
      firm_id: currentFirmId,
      user_id: user.id,
      reviewer_name: reviewerName,
      rating,
      review_text: reviewText,
      status: "pending"
    });

    if (error) throw error;

    reviewForm.reset();
    updateReviewAccess();
    reviewMessage.textContent = "Thank you! Your review is awaiting admin approval.";
  } catch (error) {
    console.error("Review submission failed:", error);
    reviewMessage.textContent = error.message || "Sorry, your review could not be submitted. Please try again.";
  } finally {
    reviewSubmit.disabled = false;
  }
});

/* ---------- SESSION CHANGES ---------- */
db.auth.onAuthStateChange(async (_event, session) => {
  const user = session?.user;
  currentUser = user?.email_confirmed_at ? user : null;
  updateReviewAccess();

  // Refresh save button state when session changes
  isFavorited = await checkIfFavorited();
  updateSaveButton();
});

/* Initial render */
renderAuthArea();
await loadFirm();
</script>
</body>
</html>
