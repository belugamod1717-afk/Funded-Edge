<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firm — FundedEdge</title><link rel="stylesheet" href="style.css"><script>

></div>`}}renderFirm();document.addEventListener('fundededge-firms-updated',renderFirm);
