<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Prop Firms — FundedEdge</title>
<meta name="description" content="Browse every prop firm on FundedEdge. Filter by category, account size, price, and profit split.">
<meta name="theme-color" content="#0b0e11">
<link rel="icon" type="image/png" sizes="32x32" href="/logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">

<meta property="og:site_name" content="FundedEdge">
<meta property="og:title" content="All Prop Firms — FundedEdge">
<meta property="og:description" content="Browse every prop firm on FundedEdge.">
<meta property="og:url" content="https://funded-edge-two.vercel.app/firms.html">
<meta property="og:image" content="https://funded-edge-two.vercel.app/og-image.png">

<style>
:root{
  --bg:#0b0e11;
  --surface:#131820;
  --surface-2:#161c26;
  --line:#242b35;
  --line-2:#2f3846;
  --text:#e6ebf0;
  --text-dim:#a3aebd;
  --text-mute:#6b7787;
  --accent:#4a9eff;
  --accent-dim:#2f5f8f;
  --accent-bg:rgba(74,158,255,.08);
  --success:#4ade80;
  --gold:#e4b949;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 24px}

/* Nav */
.nav{
  border-bottom:1px solid var(--line);
  background:rgba(11,14,17,.92);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:50;
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.3px;color:var(--text)}
.logo-mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#0b0e11;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.logo span{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:28px;font-size:14px}
.nav-links a{color:var(--text-dim);transition:color .15s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--text)}
.nav-actions{display:flex;align-items:center;gap:10px}
.btn-ghost{padding:8px 14px;border-radius:6px;border:1px solid var(--line-2);color:var(--text-dim);font-size:13px;font-weight:500;transition:.15s}
.btn-ghost:hover{border-color:var(--accent-dim);color:var(--text)}
.btn-primary{padding:8px 14px;border-radius:6px;background:var(--accent);color:#0b0e11;font-size:13px;font-weight:600;transition:.15s;border:1px solid var(--accent)}
.btn-primary:hover{background:#5caaff;border-color:#5caaff}
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line-2);color:var(--text);font-size:13px;font-weight:500}
.user-chip:hover{border-color:var(--accent-dim)}
.user-initial{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#0b0e11;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}

/* Page head */
.page-head{padding:48px 0 32px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:32px;line-height:1.2;letter-spacing:-.8px;font-weight:700;margin-bottom:10px}
.page-head p{color:var(--text-dim);font-size:15px;max-width:600px}

/* Filters */
.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:12px;
  padding:16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  margin:28px 0 20px;
}
.filter-field{min-width:0}
.filter-field label{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px}
.filter-field input,
.filter-field select{
  width:100%;
  padding:9px 12px;
  border:1px solid var(--line-2);
  border-radius:6px;
  background:var(--bg);
  color:var(--text);
  font-size:13.5px;
  outline:none;
  transition:.15s;
  -webkit-appearance:none;
  appearance:none;
}
.filter-field input:focus,
.filter-field select:focus{border-color:var(--accent-dim);background:var(--surface-2)}
.filter-field input::placeholder{color:var(--text-mute)}
.filter-reset{
  align-self:end;
  padding:9px 16px;
  border:1px solid var(--line-2);
  border-radius:6px;
  background:transparent;
  color:var(--text-dim);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:.15s;
  white-space:nowrap;
}
.filter-reset:hover{border-color:var(--accent-dim);color:var(--text)}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{
  padding:6px 12px;
  border-radius:999px;
  border:1px solid var(--line-2);
  background:transparent;
  color:var(--text-dim);
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  transition:.15s;
}
.chip:hover{border-color:var(--accent-dim);color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#0b0e11}

/* Results bar */
.results-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.results-count{font-size:13.5px;color:var(--text-dim)}
.results-count strong{color:var(--text);font-weight:600}

/* Grid */
.firm-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:16px;
  padding-bottom:60px;
  min-height:300px;
}

/* Firm card */
.firm-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  transition:.15s;
  display:flex;
  flex-direction:column;
}
.firm-card:hover{border-color:var(--line-2);background:var(--surface-2)}
.firm-card-head{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.firm-logo{
  width:44px;height:44px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  font-size:14px;font-weight:700;color:var(--accent);
}
.firm-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px;background:#fff}
.firm-meta{flex:1;min-width:0}
.firm-meta .cat{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-mute);margin-bottom:4px}
.firm-meta h3{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px;overflow-wrap:anywhere}
.firm-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.badge-verified{background:rgba(74,222,128,.12);color:var(--success);border:1px solid rgba(74,222,128,.25)}
.badge-unverified{background:transparent;color:var(--text-mute);border:1px solid var(--line-2)}
.firm-rating{font-size:12px;font-weight:600;color:var(--gold);white-space:nowrap}
.firm-desc{font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.firm-rows{border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:14px}
.row-k{font-size:11px;color:var(--text-mute);margin-bottom:2px}
.row-v{font-size:13px;color:var(--text);font-weight:500;overflow-wrap:anywhere}
.firm-cta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);padding-top:12px;border-top:1px solid var(--line);margin-top:auto}
.firm-cta:hover{color:#5caaff}

/* Empty / loading */
.empty-state{padding:60px 24px;text-align:center;border:1px dashed var(--line-2);border-radius:10px;color:var(--text-dim);grid-column:1/-1}
.empty-state h3{color:var(--text);font-size:18px;margin-bottom:8px;font-weight:600}
.empty-state p{margin-bottom:20px;font-size:14px}
.empty-state button{padding:9px 18px;border:1px solid var(--line-2);border-radius:6px;background:transparent;color:var(--text);font-weight:500;cursor:pointer;transition:.15s}
.empty-state button:hover{border-color:var(--accent-dim);background:var(--accent-bg)}
.loading-state{padding:60px 24px;text-align:center;color:var(--text-mute);font-size:14px;grid-column:1/-1}

/* Footer */
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--text-mute);font-size:13px}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.footer-links{display:flex;gap:20px}
.footer-links a:hover{color:var(--text-dim)}

/* Responsive */
@media (max-width:900px){
  .filters{grid-template-columns:1fr 1fr;padding:14px}
  .filters .filter-field:nth-child(1){grid-column:1/-1}
  .filters .filter-reset{grid-column:1/-1}
}
@media (max-width:640px){
  .nav-links{gap:16px;font-size:13px}
  .nav-links .hide-mobile{display:none}
  .container{padding:0 18px}
  .filters{grid-template-columns:1fr}
  .firm-grid{grid-template-columns:1fr;gap:14px}
  .page-head{padding:32px 0 24px}
  .page-head h1{font-size:24px}
}
</style>
</head>

<body>

<nav class="nav">
  <div class="container nav-inner">
    <a class="logo" href="/">
      <span class="logo-mark">F</span>
      Funded<span>Edge</span>
    </a>
    <div class="nav-links">
      <a href="firms.html" class="active">Prop Firms</a>

    <div class="filters">

<script type="module">
import { db } from "./supabase.js";

const $ = id => document.getElementById(id);
let allFirms = [];
let currentChip = "all";

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function getLogoDomain(firm){
  const name = (firm.name || "").toLowerCase().trim();
  const known = {"ftmo":"ftmo.com","the5ers":"the5ers.com","the 5ers":"the5ers.com","topstep":"topstep.com","apex trader funding":"apextraderfunding.com"};
  if (known[name]) return known[name];
  try { const u = new URL(firm.official_website || ""); if (u.protocol === "https:" || u.protocol === "http:") return u.hostname; } catch(_) {}
  return "";
}
function getInitials(name){
  const words = String(name || "PF").trim().split(/\s+/).filter(Boolean);
  return words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : (words[0] || "PF").slice(0,2).toUpperCase();
}
function logoURL(firm){
  const d = getLogoDomain(firm);
  return firm.logo_url || (d ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=128` : "");
}
function getNumbers(value){
  const matches = String(value ?? "").match(/\d[\d,]*(?:\.\d+)?\s*[kKmM]?/g) || [];
  return matches.map(item => {
    const cleaned = item.replace(/,/g,"").replace(/\s/g,"");
    const mult = /m$/i.test(cleaned) ? 1e6 : /k$/i.test(cleaned) ? 1e3 : 1;
    return parseFloat(cleaned.replace(/[kKmM]$/,"")) * mult;
  }).filter(Number.isFinite);
}

async function syncAuthNav(){
  const area = $("feAuthArea");
  if (!area) return;
  try {
    const { data } = await db.auth.getSession();
    const user = data.session?.user;
    if (user && user.email_confirmed_at) {
      const name = user.user_metadata?.full_name || user.email || "Account";
      const initial = String(name).trim().charAt(0).toUpperCase() || "U";
      area.innerHTML = `<a class="user-chip" href="dashboard.html"><span class="user-initial">${esc(initial)}</span><span>Dashboard</span></a>`;
    }
  } catch (err) { console.error(err); }
}

function buildCategoryDropdown(){
  const sel = $("fCategory");
  const cats = [...new Set(allFirms.map(f => f.category).filter(Boolean))].sort();
  cats.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    sel.appendChild(opt);
  });
}

document.querySelectorAll(".chip").forEach(c => {
  c.onclick = () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    currentChip = c.dataset.filter;
    renderFirms();
  };
});

function renderFirms(){
  const grid = $("firmGrid");
  const search = ($("fSearch").value || "").toLowerCase().trim();
  const category = $("fCategory").value;
  const minAccount = Number($("fAccount").value || 0);
  const maxPrice = Number($("fPrice").value || 999999);

  let list = allFirms.slice();

  if (currentChip === "verified") list = list.filter(f => f.verified);
  else if (currentChip === "top") list = list.filter(f => Number(f.rating) >= 4.5);
  else if (currentChip === "cheap") list = list.filter(f => {
    const n = getNumbers(f.price);
    return n.length && Math.min(...n) <= 100;
  });
  else if (currentChip !== "all") list = list.filter(f => f.category === currentChip);

  if (search) {
    list = list.filter(f => {
      const haystack = [f.name, f.category, f.description, f.tag, f.platforms].join(" ").toLowerCase();
      return haystack.includes(search);
    });
  }
  if (category) list = list.filter(f => f.category === category);
  if (minAccount) {
    list = list.filter(f => {
      const sizes = getNumbers(f.account_sizes);
      const max = sizes.length ? Math.max(...sizes) : 0;
      return max >= minAccount;
    });
  }
  if (maxPrice !== 999999) {
    list = list.filter(f => {
      const prices = getNumbers(f.price);
      const start = prices.length ? Math.min(...prices) : null;
      return start !== null && start <= maxPrice;
    });
  }

  list.sort((a,b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));

  $("resultsCount").innerHTML = `Showing <strong>${list.length}</strong> of ${allFirms.length} firms`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">
      <h3>No firms match your filters</h3>
      <p>Try widening your search or resetting the filters.</p>
      <button id="emptyReset" type="button">Reset filters</button>
    </div>`;
    const btn = document.getElementById("emptyReset");
    if (btn) btn.onclick = resetFilters;
    return;
  }

  grid.innerHTML = list.map(firm => {
    const logo = logoURL(firm);
    const initials = getInitials(firm.name);
    const rating = firm.rating ? `★ ${firm.rating}` : "—";
    const badge = firm.verified
      ? `<span class="badge badge-verified">Verified</span>`
      : `<span class="badge badge-unverified">Unverified</span>`;

    return `<a class="firm-card" href="firm.html?id=${encodeURIComponent(firm.id)}">
      <div class="firm-card-head">
        <div class="firm-logo">
          <span>${esc(initials)}</span>
          ${logo ? `<img src="${esc(logo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
        </div>
        <div class="firm-meta">
          <div class="cat">${esc(firm.category || "Prop Firm")}</div>
          <h3>${esc(firm.name)}</h3>
          <div class="firm-badges">${badge}</div>
        </div>
        <div class="firm-rating">${esc(rating)}</div>
      </div>
      <p class="firm-desc">${esc(firm.description || "Trading conditions and account options.")}</p>
      <div class="firm-rows">
        <div><div class="row-k">Accounts</div><div class="row-v">${esc(firm.account_sizes || "—")}</div></div>
        <div><div class="row-k">From</div><div class="row-v">${esc(firm.price || "—")}</div></div>
        <div><div class="row-k">Target</div><div class="row-v">${esc(firm.profit_target || "—")}</div></div>
        <div><div class="row-k">Split</div><div class="row-v">${esc(firm.profit_split || "—")}</div></div>
      </div>
      <span class="firm-cta">View details →</span>
    </a>`;
  }).join("");
}

function resetFilters(){
  $("fSearch").value = "";
  $("fCategory").value = "";
  $("fAccount").value = "0";
  $("fPrice").value = "999999";
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
  document.querySelector('.chip[data-filter="all"]').classList.add("active");
  currentChip = "all";
  renderFirms();
}

async function loadFirms(){
  try {
    const { data, error } = await db.from("firms").select("*").eq("status","active").order("rating",{ascending:false});
    if (error) throw error;
    allFirms = data || [];
    buildCategoryDropdown();
    renderFirms();
  } catch (err) {
    console.error(err);
    $("firmGrid").innerHTML = `<div class="empty-state"><h3>Could not load firms</h3><p>${esc(err.message)}</p></div>`;
    $("resultsCount").textContent = "Error loading firms";
  }
}

$("fSearch").addEventListener("input", renderFirms);
$("fCategory").addEventListener("change", renderFirms);
$("fAccount").addEventListener("change", renderFirms);
$("fPrice").addEventListener("change", renderFirms);
$("fReset").addEventListener("click", resetFilters);

syncAuthNav();
loadFirms();
</script>
</body>
