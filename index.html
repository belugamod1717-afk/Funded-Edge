<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07110d;
  --panel:#0d1a13;
  --panel2:#102219;
  --border:rgba(160,210,180,.15);
  --green:#72f0a8;
  --green2:#35c878;
  --text:#f0f8f2;
  --muted:#9aafa0;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:95px}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  line-height:1.6;
  overflow-x:hidden;
  position:relative;
  cursor:default;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}

/* ======================== ANIMATIONS ======================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.9)}}
@keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
@keyframes gridMove{from{background-position:0 0}to{background-position:60px 60px}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
@keyframes orbit{from{transform:rotate(0deg) translateX(70px) rotate(0deg)}to{transform:rotate(360deg) translateX(70px) rotate(-360deg)}}
@keyframes drawLine{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes dotTravel{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes riseFade{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bubbleRise{from{transform:translateY(0) scale(1);opacity:.7}to{transform:translateY(-400px) scale(1.6);opacity:0}}
@keyframes tickerSlide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes numPop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rotateSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ======================== AMBIENT ======================== */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient::before{
  content:"";position:absolute;top:-300px;left:-200px;
  width:900px;height:900px;
  background:radial-gradient(circle,rgba(114,240,168,.10),transparent 60%);
  animation:glowPulse 8s ease-in-out infinite;
}
.ambient::after{
  content:"";position:absolute;bottom:-400px;right:-200px;
  width:800px;height:800px;
  background:radial-gradient(circle,rgba(53,200,120,.07),transparent 65%);
  animation:glowPulse 10s ease-in-out infinite reverse;
}
.grid-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(114,240,168,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(114,240,168,.04) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridMove 30s linear infinite;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
}

/* Cursor glow */
.cursor-glow{
  position:fixed;
  width:380px;height:380px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(114,240,168,.14),transparent 60%);
  pointer-events:none;
  z-index:0;
  transform:translate(-50%,-50%);
  transition:opacity .4s;
  opacity:0;
  will-change:transform;
}
@media(hover:hover){.cursor-glow{opacity:1}}

/* Particles */
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.particle{
  position:absolute;
  width:4px;height:4px;border-radius:50%;
  background:var(--green);
  opacity:0;
  box-shadow:0 0 10px var(--green);
  animation:bubbleRise 12s linear infinite;
}

.container{width:min(1160px,91%);margin:auto;position:relative;z-index:1}

/* ======================== NAV ======================== */
.nav{
  position:sticky;top:0;z-index:100;
  background:rgba(7,17,13,.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  animation:fadeIn .5s ease;
}
.nav-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{
  display:flex;align-items:center;gap:10px;
  font-family:Manrope,sans-serif;font-weight:800;font-size:22px;
  letter-spacing:-1px;flex-shrink:0;transition:.3s;
}
.logo:hover{transform:translateY(-1px);text-shadow:0 0 24px rgba(114,240,168,.5)}
.logo span{color:var(--green)}
.logo-mark{
  display:grid;place-items:center;
  width:37px;height:37px;border-radius:11px;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:#07110d;font-size:20px;font-weight:900;
  box-shadow:0 0 20px rgba(114,240,168,.35);
  transition:.4s cubic-bezier(.4,0,.2,1);
}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.05)}
.nav-links{display:flex;align-items:center;gap:24px;color:#bdcbbf;font-size:14px}
.nav-links a{position:relative;transition:color .25s}
.nav-links a::after{content:"";position:absolute;bottom:-5px;left:0;width:0;height:2px;background:var(--green);transition:width .3s cubic-bezier(.4,0,.2,1);border-radius:2px}
.nav-links a:hover{color:var(--green)}
.nav-links a:hover::after{width:100%}
.nav-cta{
  background:var(--green);color:#07110d;font-weight:700;
  border-radius:10px;padding:12px 18px;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;
  transition:.25s cubic-bezier(.4,0,.2,1);
  border:1px solid transparent;cursor:pointer;
  position:relative;overflow:hidden;
}
.nav-cta::before{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%)}
.nav-cta:hover::before{animation:shine .8s}
.nav-cta:hover{background:#a0ffc4;transform:translateY(-2px);box-shadow:0 10px 30px rgba(114,240,168,.3)}

.fe-auth-area{display:flex;align-items:center;gap:10px}
.fe-auth-area .fe-auth-signin,.fe-auth-area .fe-auth-signup{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;
  text-decoration:none;transition:.25s;
}
.fe-auth-area .fe-auth-signin{background:transparent;color:#e0ece3;border:1px solid #2a4534}
.fe-auth-area .fe-auth-signin:hover{border-color:var(--green);color:var(--green);transform:translateY(-1px)}
.fe-auth-area .fe-auth-signup{background:var(--green);color:#07110d;border:1px solid var(--green)}
.fe-auth-area .fe-auth-signup:hover{background:#a0ffc4;transform:translateY(-1px);box-shadow:0 8px 20px rgba(114,240,168,.3)}
.fe-auth-area .fe-user-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border:1px solid #2a4534;border-radius:10px;
  color:#e0ece3;font-weight:600;font-size:13px;
  background:rgba(114,240,168,.08);transition:.25s;
}
.fe-auth-area .fe-user-chip:hover{border-color:var(--green);color:var(--green);transform:translateY(-1px)}
.fe-auth-area .fe-user-initial{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:#07110d;font-weight:800;font-size:11px}

/* ======================== SCROLL REVEAL ======================== */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1)}
.reveal.in{opacity:1;transform:translateY(0)}
.reveal-stagger>*{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s cubic-bezier(.4,0,.2,1)}
.reveal-stagger.in>*{opacity:1;transform:translateY(0)}
.reveal-stagger.in>*:nth-child(1){transition-delay:.05s}
.reveal-stagger.in>*:nth-child(2){transition-delay:.13s}
.reveal-stagger.in>*:nth-child(3){transition-delay:.21s}
.reveal-stagger.in>*:nth-child(4){transition-delay:.29s}
.reveal-stagger.in>*:nth-child(5){transition-delay:.37s}
.reveal-stagger.in>*:nth-child(6){transition-delay:.45s}
.reveal-stagger.in>*:nth-child(7){transition-delay:.53s}
.reveal-stagger.in>*:nth-child(8){transition-delay:.61s}

/* ======================== HERO ======================== */
.hero{
  position:relative;overflow:hidden;
  padding:110px 0 90px;
  background:
    radial-gradient(ellipse at 78% 30%, rgba(41,133,78,.19), transparent 40%),
    radial-gradient(ellipse at 12% 5%, rgba(42,100,65,.12), transparent 42%);
}
.hero-inner{
  display:grid;grid-template-columns:1.1fr .9fr;
  gap:60px;align-items:center;
}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr;gap:40px}}

.hero-copy>*{animation:fadeUp .8s ease both}
.hero-copy>*:nth-child(1){animation-delay:.05s}
.hero-copy>*:nth-child(2){animation-delay:.15s}
.hero-copy>*:nth-child(3){animation-delay:.25s}
.hero-copy>*:nth-child(4){animation-delay:.35s}
.hero-copy>*:nth-child(5){animation-delay:.45s}

.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  color:var(--green);font-size:12px;font-weight:700;
  letter-spacing:1.7px;text-transform:uppercase;
  border:1px solid #254832;border-radius:50px;
  padding:7px 14px;background:rgba(15,41,25,.6);
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);box-shadow:0 0 12px var(--green);
  animation:pulse 2s ease-in-out infinite;
}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-1.3px}
h1{
  font-size:clamp(40px,6.2vw,72px);
  line-height:1.05;max-width:760px;
  margin:25px 0 22px;font-weight:800;
  background:linear-gradient(180deg,#fff 0%,#c9ded2 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.gradient{
  background:linear-gradient(135deg,#72f0a8 0%,#35c878 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  position:relative;
}
.gradient::after{
  content:"";position:absolute;bottom:-4px;left:0;
  width:100%;height:3px;
  background:linear-gradient(90deg,var(--green),transparent);
  border-radius:2px;
}
.hero p{color:#a9bbae;max-width:600px;font-size:17px;line-height:1.8;margin:0}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.primary-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 26px;border-radius:12px;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:#07110d;font-weight:800;font-size:15px;
  transition:.3s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;border:1px solid transparent;cursor:pointer;
}
.primary-btn::before{
  content:"";position:absolute;top:0;left:0;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-100%);
}
.primary-btn:hover::before{animation:shine .8s}
.primary-btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(114,240,168,.4)}
.primary-btn .arrow{transition:transform .3s}
.primary-btn:hover .arrow{transform:translateX(4px)}
.secondary-btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 24px;border:1px solid #2a4534;border-radius:12px;
  color:#e0ece3;font-weight:600;font-size:15px;transition:.25s;
}
.secondary-btn:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px);background:rgba(114,240,168,.05)}
.trust-line{display:flex;flex-wrap:wrap;gap:22px;margin-top:34px;color:#9eb2a2;font-size:12px}
.trust-line span{display:inline-flex;align-items:center;gap:7px}
.trust-line span::before{content:"✓";color:var(--green);font-weight:bold}

/* ======================== HERO VISUAL (CHART) ======================== */
.hero-visual{
  position:relative;
  height:440px;
  animation:fadeIn 1.1s ease .3s both;
}
@media(max-width:900px){.hero-visual{height:360px}}

.chart-panel{
  position:relative;
  width:100%;height:100%;
  background:linear-gradient(145deg,#0f1e16,#091410);
  border:1px solid #2a4534;
  border-radius:22px;
  overflow:hidden;
  box-shadow:
    0 40px 100px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.03);
}
.chart-panel::before{
  content:"";position:absolute;inset:0;border-radius:22px;padding:1px;
  background:linear-gradient(135deg,rgba(114,240,168,.5),transparent 45%,transparent 55%,rgba(114,240,168,.3));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
.chart-header{
  position:absolute;top:0;left:0;right:0;
  padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(114,240,168,.1);
  z-index:2;
}
.chart-header .title{
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:800;letter-spacing:.5px;
}
.chart-header .live-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 12px var(--green);
  animation:pulse 1.6s ease-in-out infinite;
}
.chart-header .value{
  font-size:14px;font-weight:800;color:var(--green);
  font-variant-numeric:tabular-nums;
}

.chart-svg{
  position:absolute;inset:44px 0 0 0;
  width:100%;height:calc(100% - 44px);
  z-index:1;
}
.chart-line{
  fill:none;
  stroke:url(#lineGradient);
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:1000;
  stroke-dashoffset:1000;
  animation:drawLine 3s cubic-bezier(.4,0,.2,1) .5s forwards;
  filter:drop-shadow(0 0 12px rgba(114,240,168,.7));
}
.chart-area{
  fill:url(#areaGradient);
  opacity:0;
  animation:fadeIn 1.5s ease 2s forwards;
}
.chart-grid line{
  stroke:rgba(114,240,168,.08);
  stroke-width:1;
}
.travel-dot{
  fill:#fff;
  filter:drop-shadow(0 0 10px var(--green)) drop-shadow(0 0 20px var(--green));
  offset-path:path("M 20,180 C 80,160 120,140 180,120 S 300,60 380,40");
  animation:dotTravel 3s cubic-bezier(.4,0,.2,1) .5s forwards;
}

.chart-badges{
  position:absolute;
  bottom:20px;left:20px;right:20px;
  display:flex;gap:10px;z-index:2;
}
.chart-badge{
  flex:1;
  padding:12px 14px;
  background:rgba(5,16,10,.75);
  border:1px solid #1f3227;
  border-radius:12px;
  backdrop-filter:blur(8px);
  animation:fadeUp .8s ease both;
}
.chart-badge:nth-child(1){animation-delay:2.3s}
.chart-badge:nth-child(2){animation-delay:2.45s}
.chart-badge:nth-child(3){animation-delay:2.6s}
.chart-badge small{
  display:block;color:#7a8a80;
  font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;
}
.chart-badge strong{
  display:block;
  font-size:15px;font-weight:800;
  color:#eaf5ed;
  font-variant-numeric:tabular-nums;
}
.chart-badge strong.up::after{
  content:" ▲";color:var(--green);font-size:10px;
}

/* Orbit dots around chart */
.orbit{
  position:absolute;
  top:50%;left:50%;
  width:0;height:0;
  animation:orbit 24s linear infinite;
  pointer-events:none;
}
.orbit-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px var(--green),0 0 32px rgba(114,240,168,.5);
}
.orbit-2{animation-duration:18s;animation-direction:reverse}
.orbit-2 .orbit-dot{background:#7cc9f0;box-shadow:0 0 16px #7cc9f0}
.orbit-3{animation-duration:30s}
.orbit-3 .orbit-dot{background:#f5d77b;box-shadow:0 0 16px #f5d77b}

/* ======================== STATS ======================== */
.stats-band{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:16px;padding:0 0 60px;
}
.stat{
  padding:26px;
  border:1px solid var(--border);border-radius:18px;
  background:linear-gradient(140deg,#0e1d14,#0a1510);
  transition:.4s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.stat::before{
  content:"";position:absolute;top:-50%;right:-50%;
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(114,240,168,.18),transparent 70%);
  opacity:0;transition:opacity .4s;pointer-events:none;
}
.stat::after{
  content:"";position:absolute;left:0;bottom:0;
  width:100%;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  transform:scaleX(0);transform-origin:left;
  transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.stat:hover{transform:translateY(-8px);border-color:rgba(114,240,168,.5);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.stat:hover::before{opacity:1}
.stat:hover::after{transform:scaleX(1)}
.stat .icon{
  width:42px;height:42px;display:grid;place-items:center;
  border-radius:12px;background:rgba(114,240,168,.1);
  color:var(--green);font-size:20px;font-weight:800;
  margin-bottom:16px;transition:.4s cubic-bezier(.4,0,.2,1);
}
.stat:hover .icon{transform:rotate(-10deg) scale(1.15);background:rgba(114,240,168,.2);box-shadow:0 0 25px rgba(114,240,168,.4)}
.stat strong{display:block;font:800 22px Manrope,sans-serif;color:var(--text);margin-bottom:6px;letter-spacing:-.4px}
.stat span{font-size:13px;color:var(--muted);line-height:1.5}

/* ======================== SECTION ======================== */
.section{padding:50px 0 70px;scroll-margin-top:95px;position:relative}
.section-head{
  display:flex;justify-content:space-between;
  align-items:end;gap:20px;margin-bottom:32px;
}
.section-kicker{
  font-size:11px;color:var(--green);font-weight:700;
  letter-spacing:1.8px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px;
}
.section-kicker::before{content:"";width:24px;height:1px;background:var(--green)}
h2{
  font-size:clamp(28px,4vw,42px);margin:10px 0 8px;line-height:1.15;
  background:linear-gradient(180deg,#fff 0%,#b8cec0 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.section-head p{margin:0;color:var(--muted);font-size:14px}
.section-note{font-size:12px;color:#91a797;display:inline-flex;align-items:center;gap:6px}

#firmsGrid{min-height:120px}
#firmsGrid:empty:before{
  content:"Loading prop firms...";display:block;padding:40px;
  text-align:center;color:var(--muted);
  border:1px dashed var(--border);border-radius:14px;
  background:linear-gradient(90deg,transparent 0%,rgba(114,240,168,.06) 50%,transparent 100%),#0a1510;
  background-size:500px 100%;animation:shimmer 1.6s infinite linear;
}

/* Filters (matches app.js) */
.fe-filters-toggle{display:none;align-items:center;justify-content:center;gap:8px;width:100%;margin:18px 0 0;padding:14px;border:1px solid #315343;border-radius:12px;background:linear-gradient(145deg,#102219,#0a1510);color:#8ff4b5;font-weight:800;font-size:14px;cursor:pointer;transition:.2s}
.fe-filters-toggle:hover{border-color:var(--green);background:#183b27}
.fe-filters-toggle .fe-caret{display:inline-block;transition:transform .2s;font-size:11px}
.fe-filters-toggle.is-open .fe-caret{transform:rotate(180deg)}
.fe-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:14px 0 24px;padding:20px;border:1px solid #254634;border-radius:16px;background:linear-gradient(145deg,#102219,#0a1510);box-shadow:0 12px 35px rgba(0,0,0,.12)}
.fe-filters input,.fe-filters select{box-sizing:border-box;width:100%;min-width:0;padding:12px;border:1px solid #315343;border-radius:9px;background:#0a1710;color:#f1f7f3;font:inherit;outline:none;transition:.2s}
.fe-filters input:focus,.fe-filters select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(114,240,168,.1)}
.fe-filters input::placeholder{color:#91a99a}
.fe-filter-label{display:block;margin-bottom:7px;color:#b6cabb;font-size:12px;font-weight:600}
.fe-filter-actions{display:flex;align-items:end}
.fe-reset{width:100%;padding:12px;border:1px solid #315343;border-radius:9px;background:#183b27;color:#8ff4b5;font-weight:700;cursor:pointer;transition:.2s}
.fe-reset:hover{background:#214b32;border-color:var(--green)}
.fe-results-count{margin:14px 0;color:#9eb4a4;font-size:13px}

#firmsGrid .firm-card{
  box-sizing:border-box;position:relative;
  display:flex;flex-direction:column;min-width:0;
  padding:24px;overflow:hidden;
  border:1px solid #274735;border-radius:18px;
  background:radial-gradient(ellipse at top right,rgba(57,133,82,.12),transparent 48%),linear-gradient(145deg,#112219,#0b1510 80%);
  box-shadow:0 8px 26px rgba(0,0,0,.13);
  transition:transform .35s cubic-bezier(.4,0,.2,1),border-color .35s,box-shadow .35s;
}
#firmsGrid .firm-card:hover{transform:translateY(-6px);border-color:#4e9166;box-shadow:0 20px 45px rgba(0,0,0,.3),0 0 0 1px rgba(114,240,168,.15)}

/* ======================== FEATURES ======================== */
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature{
  border:1px solid var(--border);border-radius:18px;
  background:linear-gradient(145deg,var(--panel),#0a1510);
  padding:26px;transition:.4s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.feature::before{
  content:"";position:absolute;top:-40%;right:-40%;
  width:180px;height:180px;
  background:radial-gradient(circle,rgba(114,240,168,.12),transparent 70%);
  opacity:0;transition:opacity .4s;
}
.feature:hover{border-color:rgba(114,240,168,.4);transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.35)}
.feature:hover::before{opacity:1}
.feature-icon{
  width:48px;height:48px;display:grid;place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,rgba(114,240,168,.15),rgba(114,240,168,.05));
  color:var(--green);font-size:22px;margin-bottom:20px;
  border:1px solid rgba(114,240,168,.2);
  transition:.4s cubic-bezier(.4,0,.2,1);
}
.feature:hover .feature-icon{transform:rotate(-10deg) scale(1.1);box-shadow:0 0 25px rgba(114,240,168,.3)}
.feature h3{font-size:17px;letter-spacing:-.4px;margin:0 0 10px;font-weight:800}
.feature p{font-size:13.5px;line-height:1.75;color:var(--muted);margin:0}
