<style>
:root[data-theme="dark"]{--bg:#0b0e11;--surface:#131820;--surface-2:#161c26;--line:#242b35;--line-2:#2f3846;--text:#e6ebf0;--text-dim:#a3aebd;--text-mute:#6b7787;--accent:#4a9eff;--accent-dim:#2f5f8f;--accent-bg:rgba(74,158,255,.08);--success:#4ade80;--gold:#e4b949;--danger:#ff6b6b;}
:root[data-theme="light"]{--bg:#f7f8fa;--surface:#ffffff;--surface-2:#f2f4f7;--line:#e1e5eb;--line-2:#d1d7de;--text:#1a1f26;--text-dim:#525c69;--text-mute:#8a94a0;--accent:#1e75e8;--accent-dim:#1857b3;--accent-bg:rgba(30,117,232,.08);--success:#16a34a;--gold:#c99b1e;--danger:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.topbar{height:56px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:40;}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.3px;color:var(--text);flex-shrink:0;}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.logo span{color:var(--accent)}
.topbar-spacer{flex:1}
.nav-links{display:flex;gap:22px;font-size:13.5px;color:var(--text-dim)}
.nav-links a:hover{color:var(--text)}
.topbar-btn{width:34px;height:34px;border:1px solid var(--line-2);border-radius:7px;background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:15px;transition:.15s;}
.topbar-btn:hover{border-color:var(--accent-dim);color:var(--text)}
.btn-ghost{padding:7px 12px;border-radius:7px;border:1px solid var(--line-2);background:transparent;color:var(--text-dim);font-size:12.5px;font-weight:500;transition:.15s;text-decoration:none;}
.btn-ghost:hover{border-color:var(--accent-dim);color:var(--text)}
.btn-primary{padding:7px 14px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;border:1px solid var(--accent);transition:.15s;text-decoration:none;}
.btn-primary:hover{background:var(--accent-dim);border-color:var(--accent-dim)}
.user-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:500;color:var(--text);transition:.15s;text-decoration:none;}
.user-chip:hover{border-color:var(--accent-dim)}
.user-initial{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;}
main{max-width:1200px;margin:0 auto;padding:24px 24px 60px}
.page-head{padding:24px 0 24px;border-bottom:1px solid var(--line);margin-bottom:8px}
.page-head h1{font-size:30px;line-height:1.2;letter-spacing:-.7px;font-weight:700;margin-bottom:8px;}
.page-head p{color:var(--text-dim);font-size:14.5px;max-width:600px;}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:24px 0 20px;}
.filter-field{min-width:0}
.filter-field label{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px;}
.filter-field input,.filter-field select{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--text);font-size:13.5px;outline:none;transition:.15s;-webkit-appearance:none;appearance:none;}
.filter-field input:focus,.filter-field select:focus{border-color:var(--accent-dim);background:var(--surface-2)}
.filter-field input::placeholder{color:var(--text-mute)}
.filter-reset{align-self:end;padding:9px 16px;border:1px solid var(--line-2);border-radius:6px;background:transparent;color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap;}
.filter-reset:hover{border-color:var(--accent-dim);color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--text-dim);font-size:12.5px;font-weight:500;cursor:pointer;transition:.15s;}
.chip:hover{border-color:var(--accent-dim);color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.results-bar{margin-bottom:20px}
.results-count{font-size:13.5px;color:var(--text-dim)}
.results-count strong{color:var(--text);font-weight:600}
.firm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding-bottom:60px;min-height:300px;}
.firm-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;transition:.15s;display:flex;flex-direction:column;}
.firm-card:hover{border-color:var(--line-2);background:var(--surface-2)}
.firm-card-head{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.firm-logo{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;font-size:14px;font-weight:700;color:var(--accent);}
.firm-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px;background:#fff}
.firm-meta{flex:1;min-width:0}
.firm-meta .cat{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-mute);margin-bottom:4px;}
.firm-meta h3{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px;overflow-wrap:anywhere;}
.firm-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.badge-verified{background:rgba(74,222,128,.12);color:var(--success);border:1px solid rgba(74,222,128,.25)}
.badge-unverified{background:transparent;color:var(--text-mute);border:1px solid var(--line-2)}
.firm-rating{font-size:12px;font-weight:600;color:var(--gold);white-space:nowrap;}
.firm-desc{font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.firm-rows{border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:14px;}
.row-k{font-size:11px;color:var(--text-mute);margin-bottom:2px}
.row-v{font-size:13px;color:var(--text);font-weight:500;overflow-wrap:anywhere}
.firm-cta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);padding-top:12px;border-top:1px solid var(--line);margin-top:auto}
.firm-cta:hover{color:var(--accent-dim)}
.empty-state{padding:60px 24px;text-align:center;border:1px dashed var(--line-2);border-radius:10px;color:var(--text-dim);grid-column:1/-1}
.empty-state h3{color:var(--text);font-size:18px;margin-bottom:8px;font-weight:600}
.empty-state p{margin-bottom:20px;font-size:14px}
.empty-state button{padding:9px 18px;border:1px solid var(--line-2);border-radius:6px;background:transparent;color:var(--text);font-weight:500;cursor:pointer;transition:.15s}
.empty-state button:hover{border-color:var(--accent-dim);background:var(--accent-bg)}
.loading-state{padding:60px 24px;text-align:center;color:var(--text-mute);font-size:14px;grid-column:1/-1}
footer{border-top:1px solid var(--line);padding:32px 24px;color:var(--text-mute);font-size:13px}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.footer-links{display:flex;gap:20px}
.footer-links a:hover{color:var(--text-dim)}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr;padding:14px}.filters .filter-field:nth-child(1){grid-column:1/-1}.filters .filter-reset{grid-column:1/-1}}
@media (max-width:640px){.nav-links{gap:16px;font-size:13px}.nav-links .hide-mobile{display:none}main{padding:16px 18px 40px}.filters{grid-template-columns:1fr}.firm-grid{grid-template-columns:1fr;gap:14px}.page-head{padding:16px 0 20px}.page-head h1{font-size:24px}.topbar{padding:0 12px;gap:10px}}
</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html"><span class="logo-mark">F</span>Funded<span>Edge</span></a>
  <nav class="nav-links">
    <a href="firms.html" style="color:var(--text)">Prop Firms</a>
    <a class="hide-mobile" href="blog.html">Blog</a>
    <a class="hide-mobile" href="index.html#how">How it works</a>
    <a class="hide-mobile" href="index.html#faq">FAQ</a>
  </nav>
  <div class="topbar-spacer"></div>
  <button class="topbar-btn" id="themeToggle" title="Toggle theme">◐</button>
  <div id="feAuthArea" style="display:flex;align-items:center;gap:10px">
    <a class="btn-ghost" href="auth.html?mode=signin">Sign in</a>
    <a class="btn-primary" href="auth.html?mode=signup">Get started</a>
  </div>
</header>

<main>
  <div class="page-head">
    <h1>All prop firms</h1>
    <p>Every active firm we track. Filter by category, account size, price, or profit split.</p>
  </div>

  <div class="filters">
    <div class="filter-field">
      <label for="fSearch">Search</label>
      <input id="fSearch" type="search" placeholder="Name, category, or platform…" autocomplete="off">
    </div>
    <div class="filter-field">
      <label for="fCategory">Category</label>
      <select id="fCategory"><option value="">All categories</option></select>
    </div>
    <div class="filter-field">
      <label for="fAccount">Min account</label>
      <select id="fAccount">
        <option value="0">Any</option>
        <option value="10000">$10K+</option>
        <option value="25000">$25K+</option>
        <option value="50000">$50K+</option>
        <option value="100000">$100K+</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="fPrice">Max price</label>
      <select id="fPrice">
        <option value="999999">Any</option>
        <option value="50">$50</option>
        <option value="100">$100</option>
        <option value="200">$200</option>
      </select>
    </div>
    <button class="filter-reset" id="fReset" type="button">Reset</button>
  </div>

  <div class="chips" id="chipsRow">
    <button class="chip active" data-filter="all">All firms</button>
    <button class="chip" data-filter="verified">Verified</button>
    <button class="chip" data-filter="top">Top rated</button>
    <button class="chip" data-filter="cheap">Under $100</button>
    <button class="chip" data-filter="Forex / CFD">Forex</button>
    <button class="chip" data-filter="Futures">Futures</button>
    <button class="chip" data-filter="Crypto">Crypto</button>
  </div>

  <div class="results-bar">
    <div class="results-count" id="resultsCount">Loading firms…</div>
  </div>

  <div class="firm-grid" id="firmGrid">
    <div class="loading-state">Loading…</div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div>© Firm Garage. Independent research tool.</div>
    <div class="footer-links">
      <a href="firms.html">Prop Firms</a>
      <a href="blog.html">Blog</a>
      <a href="index.html#faq">FAQ</a>
    </div>
  </div>
</footer>

<script type="text/javascript">
var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();

var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];

s1.src='https://embed.tawk.to/6acccb3374770f34c39b55ca/1k4nvjh14';

<script type="module">
import { db } from "./supabase.js";
const $ = id => document.getElementById(id);
let allFirms = [];
let currentChip = "all";
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const THEME_KEY = "Firm Garage-theme";
function getStoredTheme(){ return localStorage.getItem(THEME_KEY) || "dark"; }
function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); localStorage.setItem(THEME_KEY, t); }
function toggleTheme(){ applyTheme(getStoredTheme() === "dark" ? "light" : "dark"); }
applyTheme(getStoredTheme());
document.getElementById("themeToggle").addEventListener("click", toggleTheme);

function getLogoDomain(firm){
  const name = (firm.name || "").toLowerCase().trim();
  const known = {"ftmo":"ftmo.com","the5ers":"the5ers.com","the 5ers":"the5ers.com","topstep":"topstep.com","apex trader funding":"apextraderfunding.com"};
  if (known[name]) return known[name];
  try { const u = new URL(firm.official_website || ""); if (u.protocol === "https:" || u.protocol === "http:") return u.hostname; } catch(_) {}
  return "";
}
function getInitials(name){ const words = String(name || "PF").trim().split(/\s+/).filter(Boolean); return words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : (words[0] || "PF").slice(0,2).toUpperCase(); }
function logoURL(firm){ const d = getLogoDomain(firm); return firm.logo_url || (d ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=128` : ""); }
function getNumbers(value){ const matches = String(value ?? "").match(/\d[\d,]*(?:\.\d+)?\s*[kKmM]?/g) || []; return matches.map(item => { const cleaned = item.replace(/,/g,"").replace(/\s/g,""); const mult = /m$/i.test(cleaned) ? 1e6 : /k$/i.test(cleaned) ? 1e3 : 1; return parseFloat(cleaned.replace(/[kKmM]$/,"")) * mult; }).filter(Number.isFinite); }

async function syncAuthNav(){
  const area = $("feAuthArea");
  if (!area) return;
  try {
    const { data } = await db.auth.getSession();
    const user = data.session?.user;
    if (user && user.email_confirmed_at) {
      const name = user.user_metadata?.full_name || user.email || "Account";
      const initial = String(name).trim().charAt(0).toUpperCase() || "U";
      area.innerHTML = `<a class="user-chip" href="dashboard.html"><span class="user-initial">${esc(initial)}</span><span>Dashboard</span></a>`;
    }
  } catch (err) { console.error(err); }
}

function buildCategoryDropdown(){
  const sel = $("fCategory");
  const cats = [...new Set(allFirms.map(f => f.category).filter(Boolean))].sort();
  cats.forEach(cat => { const opt = document.createElement("option"); opt.value = cat; opt.textContent = cat; sel.appendChild(opt); });
}

document.querySelectorAll(".chip").forEach(c => {
  c.onclick = () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    currentChip = c.dataset.filter;
    renderFirms();
  };
});

function renderFirms(){
  const grid = $("firmGrid");
  const search = ($("fSearch").value || "").toLowerCase().trim();
  const category = $("fCategory").value;
  const minAccount = Number($("fAccount").value || 0);
  const maxPrice = Number($("fPrice").value || 999999);

  let list = allFirms.slice();
  if (currentChip === "verified") list = list.filter(f => f.verified);
  else if (currentChip === "top") list = list.filter(f => Number(f.rating) >= 4.5);
  else if (currentChip === "cheap") list = list.filter(f => { const n = getNumbers(f.price); return n.length && Math.min(...n) <= 100; });
  else if (currentChip !== "all") list = list.filter(f => f.category === currentChip);

  if (search) list = list.filter(f => { const h = [f.name, f.category, f.description, f.tag, f.platforms].join(" ").toLowerCase(); return h.includes(search); });
  if (category) list = list.filter(f => f.category === category);
  if (minAccount) list = list.filter(f => { const s = getNumbers(f.account_sizes); const max = s.length ? Math.max(...s) : 0; return max >= minAccount; });
  if (maxPrice !== 999999) list = list.filter(f => { const p = getNumbers(f.price); const start = p.length ? Math.min(...p) : null; return start !== null && start <= maxPrice; });

  list.sort((a,b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));
  $("resultsCount").innerHTML = `Showing <strong>${list.length}</strong> of ${allFirms.length} firms`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><h3>No firms match your filters</h3><p>Try widening your search or resetting the filters.</p><button id="emptyReset" type="button">Reset filters</button></div>`;
    const btn = document.getElementById("emptyReset");
    if (btn) btn.onclick = resetFilters;
    return;
  }

  grid.innerHTML = list.map(firm => {
    const logo = logoURL(firm);
    const initials = getInitials(firm.name);
    const rating = firm.rating ? `★ ${firm.rating}` : "—";
    const badge = firm.verified ? `<span class="badge badge-verified">Verified</span>` : `<span class="badge badge-unverified">Unverified</span>`;
    return `<a class="firm-card" href="firm.html?id=${encodeURIComponent(firm.id)}">
      <div class="firm-card-head">
        <div class="firm-logo"><span>${esc(initials)}</span>${logo ? `<img src="${esc(logo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}</div>
        <div class="firm-meta">
          <div class="cat">${esc(firm.category || "Prop Firm")}</div>
          <h3>${esc(firm.name)}</h3>
          <div class="firm-badges">${badge}</div>
        </div>
        <div class="firm-rating">${esc(rating)}</div>
      </div>
      <p class="firm-desc">${esc(firm.description || "Trading conditions and account options.")}</p>
      <div class="firm-rows">
        <div><div class="row-k">Accounts</div><div class="row-v">${esc(firm.account_sizes || "—")}</div></div>
        <div><div class="row-k">From</div><div class="row-v">${esc(firm.price || "—")}</div></div>
        <div><div class="row-k">Target</div><div class="row-v">${esc(firm.profit_target || "—")}</div></div>
        <div><div class="row-k">Split</div><div class="row-v">${esc(firm.profit_split || "—")}</div></div>
      </div>
      <span class="firm-cta">View details →</span>
    </a>`;
  }).join("");
}

function resetFilters(){
  $("fSearch").value = "";
  $("fCategory").value = "";
  $("fAccount").value = "0";
  $("fPrice").value = "999999";
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
  document.querySelector('.chip[data-filter="all"]').classList.add("active");
  currentChip = "all";
  renderFirms();
}

async function loadFirms(){
  try {
    const { data, error } = await db.from("firms").select("*").eq("status","active").order("rating",{ascending:false});
    if (error) throw error;
    allFirms = data || [];
    buildCategoryDropdown();
    renderFirms();
  } catch (err) {
    console.error(err);
    $("firmGrid").innerHTML = `<div class="empty-state"><h3>Could not load firms</h3><p>${esc(err.message)}</p></div>`;
    $("resultsCount").textContent = "Error loading firms";
  }
}

$("fSearch").addEventListener("input", renderFirms);
$("fCategory").addEventListener("change", renderFirms);
$("fAccount").addEventListener("change", renderFirms);
$("fPrice").addEventListener("change", renderFirms);
$("fReset").addEventListener("click", resetFilters);

syncAuthNav();
loadFirms();
</script>
</body>
