  <style>
    /* AUTH AREA in nav */
    .fe-auth-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }
    .fe-auth-area .fe-auth-signin,
    .fe-auth-area .fe-auth-signup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: .2s;
    }
    .fe-auth-area .fe-auth-signin {
      background: transparent;
      color: #e0ecf3;
      border: 1px solid #2a4055;
    }
    .fe-auth-area .fe-auth-signin:hover {
      border-color: #4a9eff;
      color: #4a9eff;
    }
    .fe-auth-area .fe-auth-signup {
      background: #4a9eff;
      color: #061321;
      border: 1px solid #4a9eff;
    }
    .fe-auth-area .fe-auth-signup:hover {
      background: #7db8ff;
      border-color: #7db8ff;
    }
    .fe-auth-area .fe-user-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid #2a4055;
      border-radius: 10px;
      color: #e0ecf3;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      background: rgba(74,158,255,.08);
      transition: .2s;
    }
    .fe-auth-area .fe-user-chip:hover {
      border-color: #4a9eff;
      color: #4a9eff;
    }
    .fe-auth-area .fe-user-initial {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #4a9eff;
      color: #061321;
      font-weight: 800;
      font-size: 11px;
    }

    /* Override any green from style.css */
    :root {
      --bg: #0a0f14;
      --panel: #10161c;
      --panel2: #0d1419;
      --border: rgba(120,170,220,.15);
      --green: #4a9eff;
      --green2: #2d7dd2;
      --text: #f0f5fa;
      --muted: #8fa3b8;
    }
    body {
      background: radial-gradient(ellipse at 50% 0%, rgba(45,120,200,.12), transparent 45%), #0a0f14 !important;
      color: #f0f5fa !important;
    }
    .brand span { color: #4a9eff !important; }
    .nav { background: rgba(10,15,20,.9) !important; border-bottom-color: rgba(120,170,220,.15) !important; }
    .navlinks a:hover { color: #4a9eff !important; }
    .btn {
      background: #4a9eff !important;
      color: #061321 !important;
      border-radius: 10px;
    }
    .btn:hover { background: #7db8ff !important; }
    .eyebrow { color: #4a9eff !important; }
    h2 {
      background: linear-gradient(180deg,#fff 0%,#c9d8e2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (max-width:700px){
      .fe-auth-area{gap:6px}
      .fe-auth-area .fe-auth-signin,
      .fe-auth-area .fe-auth-signup,
      .fe-auth-area .fe-user-chip{padding:8px 10px;font-size:12px}
    }
  </style>
</head>

<body>

<header class="nav container">
  <a class="brand" href="index.html">Funded<span>Edge</span></a>
  <nav class="navlinks">
    <a href="directory.html">Prop Firms</a>
    <div id="feAuthArea" class="fe-auth-area">
      <a class="fe-auth-signin" href="auth.html?mode=signin">Sign In</a>
      <a class="fe-auth-signup" href="auth.html?mode=signup">Sign Up</a>
    </div>
  </nav>
</header>

<main class="section container">
  <div class="sectionhead">
    <div>
      <div class="eyebrow">Directory</div>
      <h2>Compare prop firms</h2>
      <p class="muted">Filter, search, and explore the full list of active firms.</p>
    </div>
  </div>

  <div id="firmsGrid" class="grid">
    <p>Loading prop firms...</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
