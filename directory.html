  <link rel="stylesheet" href="style.css">
  <style>
    /* Auth area in nav (matches homepage) */
    .fe-auth-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .fe-auth-area .fe-auth-signin,
    .fe-auth-area .fe-auth-signup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: .2s;
    }

    .fe-auth-area .fe-auth-signin {
      background: transparent;
      color: #e0ece3;
      border: 1px solid #2a4534;
    }

    .fe-auth-area .fe-auth-signin:hover {
      border-color: #72f0a8;
      color: #72f0a8;
    }

    .fe-auth-area .fe-auth-signup {
      background: #72f0a8;
      color: #07110d;
      border: 1px solid #72f0a8;
    }

    .fe-auth-area .fe-auth-signup:hover {
      background: #a0ffc4;
      border-color: #a0ffc4;
    }

    .fe-auth-area .fe-user-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid #2a4534;
      border-radius: 10px;
      color: #e0ece3;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      background: rgba(114,240,168,.06);
      transition: .2s;
    }

    .fe-auth-area .fe-user-chip:hover {
      border-color: #72f0a8;
      color: #72f0a8;
    }

    .fe-auth-area .fe-user-chip .fe-user-initial {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #72f0a8;
      color: #07110d;
      font-weight: 800;
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .fe-auth-area { gap: 6px; }
      .fe-auth-area .fe-auth-signin,
      .fe-auth-area .fe-auth-signup,
      .fe-auth-area .fe-user-chip {
        padding: 8px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<header class="nav container">
  <a class="brand" href="index.html">Funded<span>Edge</span></a>
  <nav class="navlinks">
    <a href="directory.html">Prop Firms</a>
    <a href="compare.html">Compare</a>

    <!-- Auth area: app.js swaps this based on session -->
    <div id="feAuthArea" class="fe-auth-area">
      <a class="fe-auth-signin" href="auth.html?mode=signin">Sign In</a>
      <a class="fe-auth-signup" href="auth.html?mode=signup">Sign Up</a>
    </div>
  </nav>
</header>

<main class="section container">
  <div class="sectionhead">
    <div>
      <div class="eyebrow">Directory</div>
      <h2>Compare prop firms</h2>
    </div>
    <a class="btn" href="compare.html">Comparison</a>
  </div>

  <div id="firmsGrid" class="grid">
    <p>Loading prop firms...</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
