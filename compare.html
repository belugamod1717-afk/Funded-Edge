<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare — FundedEdge</title><link rel="stylesheet" href="style.css"></head><body><header class="nav container"><a class="brand" href="index.html">Funded<span>Edge</span></a><nav class="navlinks"><a href="directory.html">Prop Firms</a><a href="compare.html">Compare</a><a href="admin.html">Admin</a></nav></header><main class="section container"><div class="sectionhead"><div><div class="eyebrow">Side-by-side</div><h2>Prop firm comparison</h2></div><a class="btn" href="directory.html">Add firms</a></div><div id="wrap"></div></main><script src="app.js"></script><script>function renderCompare(){let a=firms().filter(f=>compareIds().includes(f.id));if(!a.length){wrap.innerHTML='<div class="empty">No firms selected. Go to the directory and click Compare.</div>';return}let rows=[['Account sizes','sizes'],['Price','price'],['Profit target','target'],['Daily drawdown','dailyDD'],['Maximum drawdown','maxDD'],['Profit split','split'],['Payout','payout'],['Platforms','platforms'],['Rating','rating']];wrap.innerHTML='<div class="tablewrap"><table class="compare"><thead><tr><th>Feature</th>'+a.map(f=>'<th>'+esc(f.name)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r[0]+'</td>'+a.map(f=>'<td>'+esc(f[r[1]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><br><button class="btn btn-danger" id="clear">Clear comparison</button>';document.getElementById('clear').onclick=()=>{localStorage.removeItem(COMPARE_KEY);renderCompare()}}renderCompare();</script></body></html>
