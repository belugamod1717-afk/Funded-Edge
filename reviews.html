<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews | FundedEdge</title>
<meta name="description" content="Read what real traders say about this prop firm. Honest reviews and ratings from the FundedEdge community.">
<meta name="theme-color" content="#07110e">
<link rel="icon" type="image/png" sizes="32x32" href="/logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">

<style>
*{box-sizing:border-box}
body{margin:0;background:#07110e;color:#edf7f0;font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.55;position:relative;overflow-x:hidden}
body::before{
  content:"";position:fixed;top:-200px;left:50%;transform:translateX(-50%);
  width:900px;height:900px;
  background:radial-gradient(circle,rgba(84,227,154,.08),transparent 60%);
  pointer-events:none;z-index:0;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}

/* Header */
header{
  padding:18px 6%;border-bottom:1px solid #20372c;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  background:rgba(7,17,14,.8);backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:10;
}
header .brand{color:#54e39a;font-size:23px;font-weight:800;letter-spacing:-.5px;transition:.3s}
header .brand:hover{text-shadow:0 0 20px rgba(84,227,154,.5)}
header nav{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header nav a{color:#cfe3d6;font-size:14px;transition:color .2s}
header nav a:hover{color:#54e39a}

.fe-auth-area{display:flex;align-items:center;gap:10px}
.fe-auth-area .fe-auth-signin,.fe-auth-area .fe-auth-signup{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;text-decoration:none;transition:.2s;
}
.fe-auth-area .fe-auth-signin{background:transparent;color:#e0ece3;border:1px solid #2a4534}
.fe-auth-area .fe-auth-signin:hover{border-color:#54e39a;color:#54e39a}
.fe-auth-area .fe-auth-signup{background:#54e39a;color:#07110e;border:1px solid #54e39a}
.fe-auth-area .fe-auth-signup:hover{background:#7ff0b6}
.fe-auth-area .fe-user-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border:1px solid #2a4534;border-radius:10px;
  color:#e0ece3;font-weight:600;font-size:13px;
  background:rgba(84,227,154,.08);transition:.2s;
}
.fe-auth-area .fe-user-chip:hover{border-color:#54e39a;color:#54e39a}
.fe-auth-area .fe-user-initial{
  width:22px;height:22px;display:grid;place-items:center;
  border-radius:50%;background:#54e39a;color:#07110e;
  font-weight:800;font-size:11px;
}

/* Main */
main{max-width:900px;margin:32px auto;padding:20px;position:relative;z-index:1}

.back{
  display:inline-flex;align-items:center;gap:6px;
  color:#65e5a1;font-size:13px;margin-bottom:20px;transition:gap .2s;
}
.back:hover{gap:10px}

/* Hero */
.reviews-hero{
  padding:30px;
  background:linear-gradient(145deg,#122019,#0d1812);
  border:1px solid #294535;
  border-radius:20px;
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
  animation:fadeUp .5s ease both;
}
.reviews-hero::after{
  content:"";position:absolute;top:-50%;right:-60px;
  width:240px;height:240px;
  background:radial-gradient(circle,rgba(84,227,154,.15),transparent 70%);
  pointer-events:none;
}
.reviews-hero .eyebrow{
  font-size:11px;font-weight:800;letter-spacing:1.6px;
  color:#54e39a;text-transform:uppercase;margin-bottom:10px;
}
.reviews-hero h1{
  font-size:30px;margin:0 0 6px;letter-spacing:-.8px;
  background:linear-gradient(180deg,#fff 0%,#c9ded2 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.reviews-hero p{margin:0;color:#9cb1a3;font-size:14px}

/* Toolbar (Write a review button + count) */
.toolbar{
  display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;margin-bottom:18px;
  animation:fadeUp .5s ease .05s both;
}
.toolbar .count{color:#8a9a90;font-size:13px;font-weight:600}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:11px;
  background:linear-gradient(135deg,#54e39a,#35d875);
  color:#07110e;font-weight:800;font-size:14px;
  border:1px solid transparent;cursor:pointer;
  transition:.25s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;text-decoration:none;
}
.btn::before{
  content:"";position:absolute;top:0;left:0;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-100%);
}
.btn:hover::before{animation:shine .8s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(84,227,154,.32)}
.btn:active{transform:translateY(0)}

/* Rating summary */
.summary-card{
  padding:26px 30px;
  background:linear-gradient(145deg,#0c1813,#0a1510);
  border:1px solid #294535;border-radius:20px;
  margin-bottom:22px;
  animation:fadeUp .5s ease .1s both;
}
.summary-grid{
  display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;
}
@media(max-width:600px){.summary-grid{grid-template-columns:1fr;gap:18px}}
.summary-big{
  text-align:center;
  padding-right:32px;
  border-right:1px solid #22372c;
}
@media(max-width:600px){.summary-big{border-right:0;border-bottom:1px solid #22372c;padding:0 0 18px}}
.summary-big .num{
  font-size:56px;font-weight:900;line-height:1;letter-spacing:-2.5px;
  background:linear-gradient(180deg,#fff 0%,#8ff0b5 120%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.summary-big .stars{color:#f5d77b;font-size:18px;letter-spacing:3px;margin:10px 0 4px}
.summary-big .count{font-size:12px;color:#7a8a80;font-weight:600}

.bars{display:grid;gap:8px}
.bar-row{
  display:grid;grid-template-columns:36px 1fr 44px;gap:12px;
  align-items:center;font-size:12px;
  opacity:0;animation:fadeUp .4s ease forwards;
}
.bar-row:nth-child(1){animation-delay:.05s}
.bar-row:nth-child(2){animation-delay:.1s}
.bar-row:nth-child(3){animation-delay:.15s}
.bar-row:nth-child(4){animation-delay:.2s}
.bar-row:nth-child(5){animation-delay:.25s}
.bar-row .lbl{color:#a0a8a2;font-weight:700}
.bar-row .bar{height:8px;background:#1a2420;border-radius:20px;overflow:hidden}
.bar-row .bar span{
  display:block;height:100%;
  background:linear-gradient(90deg,#54e39a,#35d875);
  border-radius:20px;
  box-shadow:0 0 12px rgba(84,227,154,.4);
  animation:barFill .9s cubic-bezier(.4,0,.2,1) both;
}
.bar-row .pct{color:#7a8a80;text-align:right;font-weight:700}

/* Filter tabs */
.filters{
  display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;
  animation:fadeUp .5s ease .15s both;
}
.filter-btn{
  padding:9px 16px;border-radius:20px;
  background:transparent;border:1px solid #2a4534;
  color:#cfe3d6;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:.2s;
}
.filter-btn:hover{border-color:#54e39a;color:#54e39a}
.filter-btn.active{
  background:rgba(84,227,154,.12);
  border-color:#54e39a;color:#8ff0b5;
}

/* Review list */
.reviews-list{display:grid;gap:0}
.review-item{
  padding:24px 0;
  border-bottom:1px solid #1f3227;
  opacity:0;animation:fadeUp .5s ease forwards;
}
.review-item:nth-child(1){animation-delay:.1s}
.review-item:nth-child(2){animation-delay:.18s}
.review-item:nth-child(3){animation-delay:.26s}
.review-item:nth-child(4){animation-delay:.34s}
.review-item:nth-child(5){animation-delay:.42s}
.review-item:last-child{border-bottom:0}
.review-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.review-author{display:flex;align-items:center;gap:12px;min-width:0}
.review-avatar{
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  font-weight:900;font-size:17px;color:#07110e;flex-shrink:0;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
  transition:transform .2s;
}
.review-item:hover .review-avatar{transform:scale(1.08)}
.review-author-info{min-width:0}
.review-author-name{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.review-author-date{font-size:12px;color:#7a8a80;margin-top:2px}
.review-rating-inline{flex-shrink:0;font-size:16px;letter-spacing:2px;color:#f5d77b}
.review-text{margin:0;color:#d5e0d8;font-size:14px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap}

/* Empty state */
.reviews-empty{
  padding:60px 22px;text-align:center;
  border:1px dashed #2e4438;border-radius:16px;
  color:#8a9a90;font-size:14px;
  background:linear-gradient(145deg,#0c1813,#0a1510);
  animation:fadeUp .5s ease .1s both;
}
.reviews-empty .big{
  font-size:52px;margin-bottom:16px;display:block;opacity:.5;
  animation:float 3s ease-in-out infinite;
}
.reviews-empty strong{display:block;color:#d5e0d8;font-size:17px;margin-bottom:8px}
.reviews-empty p{margin:0 0 22px;max-width:400px;margin-left:auto;margin-right:auto;line-height:1.7}

.loading-state{
  padding:44px;text-align:center;color:#8a9a90;font-size:14px;
  border:1px dashed #2e4438;border-radius:16px;
  background:linear-gradient(90deg,transparent 0%,rgba(84,227,154,.05) 50%,transparent 100%),#0a1510;
  background-size:500px 100%;
  animation:shimmer 1.6s infinite linear;
}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes barFill{from{width:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

@media(max-width:600px){
  header{padding:14px 5%}
  main{padding:14px}
  .reviews-hero{padding:22px}
  .reviews-hero h1{font-size:24px}
  .summary-card{padding:22px}
  .summary-big .num{font-size:46px}
  .toolbar{flex-direction:column;align-items:stretch}
  .toolbar .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header>
  <a class="brand" href="/">FundedEdge</a>
  <nav>
    <a href="/directory.html">Prop Firms</a>
    
    <div id="feAuthArea" class="fe-auth-area">
      <a class="fe-auth-signin" href="/auth.html?mode=signin">Sign In</a>
      <a class="fe-auth-signup" href="/auth.html?mode=signup">Sign Up</a>
    </div>
  </nav>
</header>

<main>
  <a class="back" id="backLink" href="/directory.html">← Back to firm</a>

  <div class="reviews-hero">
    <div class="eyebrow">Community reviews</div>
    <h1 id="firmName">Loading…</h1>
    <p id="firmSub">Honest feedback from real traders.</p>
  </div>

  <div id="summaryWrap"></div>

  <div class="toolbar" id="toolbar" hidden>
    <div class="count" id="reviewCount"></div>
    <a class="btn" id="writeReviewBtn" href="#">Write a review →</a>
  </div>

  <div class="filters" id="filters" hidden>
    <button class="filter-btn active" data-filter="all">All reviews</button>
    <button class="filter-btn" data-filter="5">★★★★★</button>
    <button class="filter-btn" data-filter="4">★★★★</button>
    <button class="filter-btn" data-filter="3">★★★</button>
    <button class="filter-btn" data-filter="2">★★</button>
    <button class="filter-btn" data-filter="1">★</button>
  </div>

  <div id="reviewsList" class="reviews-list">
    <div class="loading-state">Loading reviews…</div>
  </div>
</main>

<script type="module">
import { db, SUPABASE_URL, SUPABASE_KEY } from "./supabase.js";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const firmId = params.get("id");

const firmName = $("firmName");
const firmSub = $("firmSub");
const backLink = $("backLink");
const summaryWrap = $("summaryWrap");
const toolbar = $("toolbar");
const reviewCount = $("reviewCount");
const writeReviewBtn = $("writeReviewBtn");
const filters = $("filters");
const reviewsList = $("reviewsList");
const authArea = $("feAuthArea");

let allReviews = [];
let currentFilter = "all";
let currentUser = null;

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function authUrl(mode) {
  const next = location.pathname + location.search;
  const q = `?next=${encodeURIComponent(next)}`;
  return mode ? `/auth.html${q}&mode=${mode}` : `/auth.html${q}`;
}

function renderAuthArea() {
  if (!authArea) return;
  if (currentUser) {
    const name = currentUser.user_metadata?.full_name || currentUser.email || "Account";
    const initial = String(name).trim().charAt(0).toUpperCase() || "U";
    authArea.innerHTML = `<a class="fe-user-chip" href="/dashboard.html"><span class="fe-user-initial">${esc(initial)}</span><span>Dashboard</span></a>`;
  } else {
    authArea.innerHTML = `<a class="fe-auth-signin" href="${authUrl("signin")}">Sign In</a><a class="fe-auth-signup" href="${authUrl("signup")}">Sign Up</a>`;
  }
}

function avatarColor(name) {
  const colors = ["#54e39a","#7cc9f0","#f5d77b","#c99df0","#f0a89d","#9df0bd"];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return colors[hash % colors.length];
}
function initials(name) {
  const parts = String(name || "?").trim().split(/\s+/);
  return ((parts[0]?.[0] || "?") + (parts[1]?.[0] || "")).toUpperCase();
}

function renderSummary(reviews) {
  if (!reviews.length) { summaryWrap.innerHTML = ""; return; }
  const total = reviews.length;
  const sum = reviews.reduce((s, r) => s + Number(r.rating || 0), 0);
  const avg = sum / total;
  const counts = [0,0,0,0,0];
  reviews.forEach(r => {
    const n = Math.max(1, Math.min(5, Number(r.rating) || 0));
    counts[n - 1]++;
  });
  const fullStars = "★".repeat(Math.round(avg)) + "☆".repeat(5 - Math.round(avg));
  const bars = [5,4,3,2,1].map(star => {
    const c = counts[star - 1];
    const pct = total ? Math.round((c / total) * 100) : 0;
    return `<div class="bar-row"><span class="lbl">${star} ★</span><div class="bar"><span style="width:${pct}%"></span></div><span class="pct">${pct}%</span></div>`;
  }).join("");

  summaryWrap.innerHTML = `
    <div class="summary-card">
      <div class="summary-grid">
        <div class="summary-big">
          <div class="num">${avg.toFixed(1)}</div>
          <div class="stars">${fullStars}</div>
          <div class="count">${total} review${total === 1 ? "" : "s"}</div>
        </div>
        <div class="bars">${bars}</div>
      </div>
    </div>
  `;
}

function renderReviews() {
  const filtered = currentFilter === "all"
    ? allReviews
    : allReviews.filter(r => Number(r.rating) === Number(currentFilter));

  if (!filtered.length) {
    reviewsList.innerHTML = `
      <div class="reviews-empty">
        <span class="big">☆</span>
        <strong>${currentFilter === "all" ? "No reviews yet" : "No reviews with this rating"}</strong>
        <p>${currentFilter === "all"
          ? "Be the first to share your experience with this firm."
          : "Try a different filter or write a new review."}</p>
        ${currentFilter === "all"
          ? `<a class="btn" href="/review.html?id=${encodeURIComponent(firmId)}">Write the first review →</a>`
          : `<button class="btn" onclick="document.querySelector('[data-filter=&quot;all&quot;]').click()">Show all reviews</button>`}
      </div>`;
    return;
  }

  reviewsList.innerHTML = filtered.map(review => {
    const date = new Date(review.created_at);
    const dateText = Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    const rating = Math.max(1, Math.min(5, Number(review.rating) || 1));
    const name = review.reviewer_name || "Anonymous";
    const initialsText = initials(name);
    const color = avatarColor(name);

    return `
      <article class="review-item">
        <div class="review-head">
          <div class="review-author">
            <div class="review-avatar" style="background:${color}">${esc(initialsText)}</div>
            <div class="review-author-info">
              <div class="review-author-name">${esc(name)}</div>
              <div class="review-author-date">${esc(dateText)}</div>
            </div>
          </div>
          <div class="review-rating-inline">${"★".repeat(rating)}${"☆".repeat(5 - rating)}</div>
        </div>
        <p class="review-text">${esc(review.review_text).replace(/\n/g, "<br>")}</p>
      </article>
    `;
  }).join("");
}

function wireFilters() {
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderReviews();
    });
  });
}

async function loadReviews() {
  if (!firmId) {
    firmName.textContent = "Firm not selected";
    firmSub.textContent = "Return to the directory to pick a firm.";
    reviewsList.innerHTML = `<div class="reviews-empty"><span class="big">⚠</span><strong>No firm selected</strong><p>Please go back and select a firm to see its reviews.</p><a class="btn" href="/directory.html">Browse firms →</a></div>`;
    return;
  }

  try {
    // Load firm name
    const { data: firms, error: fErr } = await db
      .from("firms").select("id,name").eq("id", firmId).limit(1);
    if (fErr) throw fErr;

    if (firms && firms.length) {
      const f = firms[0];
      firmName.textContent = `${f.name} · Reviews`;
      firmSub.textContent = `What traders are saying about ${f.name}.`;
      backLink.href = `/firm.html?id=${encodeURIComponent(f.id)}`;
      backLink.textContent = `← Back to ${f.name}`;
      writeReviewBtn.href = `/review.html?id=${encodeURIComponent(f.id)}`;
    } else {
      firmName.textContent = "Firm not found";
    }

    // Load approved reviews
    const { data: reviews, error: rErr } = await db
      .from("firm_reviews")
      .select("reviewer_name,rating,review_text,created_at")
      .eq("firm_id", firmId)
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (rErr) throw rErr;

    allReviews = reviews || [];
    renderSummary(allReviews);
    toolbar.hidden = false;
    filters.hidden = allReviews.length === 0;
    reviewCount.textContent = `${allReviews.length} published review${allReviews.length === 1 ? "" : "s"}`;
    renderReviews();
  } catch (err) {
    console.error(err);
    reviewsList.innerHTML = `<div class="reviews-empty"><span class="big">⚠</span><strong>Could not load reviews</strong><p>${esc(err.message)}</p></div>`;
  }
}

async function checkUser() {
  try {
    const { data: { user } } = await db.auth.getUser();
    currentUser = user?.email_confirmed_at ? user : null;
  } catch { currentUser = null; }
  renderAuthArea();
}

db.auth.onAuthStateChange((_e, session) => {
  currentUser = session?.user?.email_confirmed_at ? session.user : null;
  renderAuthArea();
});

wireFilters();
renderAuthArea();
await checkUser();
await loadReviews();
</script>
</body>
</html>
