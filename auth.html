<style>
:root{
  --bg:#0a0f14;--panel:#10161c;--panel2:#0d1419;
  --border:#22314a;--border2:#2c405a;
  --blue:#4a9eff;--blue2:#2d7dd2;--blue-deep:#173755;
  --text:#f0f5fa;--muted:#8fa3b8;--muted2:#5f7a94;
  --red:#ff6b6b;--green:#4ade80;--green-deep:#173c27;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#12203a 0%,var(--bg) 58%);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:900px;height:900px;background:radial-gradient(circle,rgba(74,158,255,.08),transparent 60%);pointer-events:none}
.wrap{width:100%;max-width:440px;position:relative;z-index:1}
.brand{text-align:center;margin-bottom:26px;font-size:27px;font-weight:850;letter-spacing:-1px}
.brand span{color:var(--blue)}
.card{padding:30px;background:rgba(16,22,28,.96);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.4);animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
h1{margin:0 0 8px;font-size:27px;letter-spacing:-.5px}
.sub{color:var(--muted);line-height:1.6;margin:0 0 24px;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:12px;background:#0a1018;border:1px solid var(--border);margin-bottom:22px}
.tabs button{border:0;border-radius:9px;padding:11px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;transition:.2s;font-size:14px}
.tabs button:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tabs button.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#061321;box-shadow:0 4px 14px rgba(74,158,255,.25)}
label{display:block;margin:16px 0 8px;font-size:13px;font-weight:700;color:#cfe0ee}
input{width:100%;padding:13px 14px;border:1px solid var(--border2);border-radius:10px;background:#0a141c;color:var(--text);font-size:15px;outline:none;transition:.2s;font-family:inherit;-webkit-appearance:none;-moz-appearance:none;appearance:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,158,255,.12);background:#0b1720}
.primary{width:100%;border:0;border-radius:10px;margin-top:22px;padding:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#061321;font-weight:850;font-size:15px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.primary::before{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%)}
.primary:hover::before{animation:shine .8s}
.primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(74,158,255,.32)}
.primary:disabled{opacity:.6;cursor:wait;transform:none}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.secondary{width:100%;padding:12px;margin-top:12px;border:1px solid var(--border2);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-weight:700;font-size:14px;transition:.2s}
.secondary:hover{border-color:var(--blue);color:var(--blue)}
.message{display:none;margin-top:17px;padding:12px 14px;border-radius:10px;line-height:1.5;font-size:14px;overflow-wrap:anywhere}
.message.show{display:block;animation:fadeUp .25s ease}
.message.success{background:var(--green-deep);color:#a9f2c4;border:1px solid #235c3b}
.message.error{background:#3a1a1e;color:#ffb7bb;border:1px solid #5a2a2f}
.links{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:13px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.small{color:var(--muted2);font-size:12px;line-height:1.6;margin-top:18px}
[hidden]{display:none!important}

/* ====== COUNTRY PICKER ====== */
.country-picker{position:relative}
.country-picker input[type="text"]{
  width:100%;padding:13px 40px 13px 14px;
  border:1px solid var(--border2);border-radius:10px;
  background:#0a141c;color:var(--text);font-size:15px;
  outline:none;transition:.2s;font-family:inherit;cursor:pointer;
}
.country-picker input[type="text"]:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(74,158,255,.12);
  background:#0b1720;
}
.country-picker::after{
  content:"▾";position:absolute;right:14px;top:50%;
  transform:translateY(-50%);color:var(--muted2);
  font-size:12px;pointer-events:none;transition:transform .2s;
}
.country-picker.open::after{transform:translateY(-50%) rotate(180deg)}
.country-picker.open input[type="text"]{cursor:text}
.country-results{
  display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;
  max-height:260px;overflow-y:auto;
  background:#0d1419;border:1px solid var(--border2);border-radius:10px;
  z-index:50;box-shadow:0 14px 40px rgba(0,0,0,.6);
}
.country-picker.open .country-results{display:block}
.country-result{
  padding:10px 14px;font-size:13.5px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:.15s;
}
.country-result:last-child{border-bottom:0}
.country-result:hover,
.country-result.highlight{background:var(--blue-deep);color:#cfe6ff}
.country-result.selected{background:rgba(74,158,255,.14);color:#8fc7ff;font-weight:700}
.country-no-match{padding:14px;text-align:center;color:var(--muted);font-size:13px}

@media(max-width:420px){.card{padding:22px}h1{font-size:23px}.brand{font-size:24px}}
</style>
</head>

<body>
<main class="wrap">
  <div class="brand">Funded<span>Edge</span></div>

  <section class="card">
    <div id="authPanel">
      <h1 id="heading">Welcome back</h1>
      <p class="sub" id="subtitle">Log in to access your FundedEdge account.</p>

      <div class="tabs">
        <button type="button" id="loginTab" class="active">Log in</button>
        <button type="button" id="signupTab">Create account</button>
      </div>

      <form id="authForm">
        <div id="nameField" hidden>
          <label for="fullName">Your name</label>
          <input id="fullName" type="text" maxlength="80" autocomplete="name" placeholder="Your name">
        </div>

        <div id="countryField" hidden>
          <label for="countrySearch">Country</label>
          <div class="country-picker">
            <input id="countrySearch" type="text" placeholder="Search countries…" autocomplete="off" readonly>
            <input id="country" type="hidden">
            <div class="country-results" id="countryResults"></div>
          </div>
        </div>

        <label for="email">Email address</label>
        <input id="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com">

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters">

        <button class="primary" id="submitButton" type="submit">Log in</button>
      </form>

      <button class="secondary" id="forgotButton" type="button">Forgot password?</button>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <p class="small">By creating an account, you agree to use FundedEdge responsibly. Never share your password with anyone.</p>
    </div>

    <div id="accountPanel" hidden>
      <h1>Your account</h1>
      <p class="sub">You are signed in to FundedEdge.</p>
      <p id="accountEmail" style="color:#cfe0ee;font-weight:600"></p>
      <p id="accountCountry" style="color:#8fa3b8;font-weight:500;font-size:14px"></p>

      <button class="primary" id="continueButton" type="button">Open Member Dashboard</button>
      <button class="secondary" id="logoutButton" type="button">Log out</button>

      <div id="accountMessage" class="message" role="status"></div>
    </div>
  </section>

  <div class="links">
    <a href="index.html">← Home</a>
    <a href="index.html#directory">Browse firms →</a>
  </div>
</main>

import { db } from "./supabase.js";

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let mode = "login";
let busy = false;

function getNextUrl() {
  const next = params.get("next");
  if (next) {
    try {
      const target = new URL(next, location.origin);
      if (target.origin === location.origin && !target.pathname.endsWith("/auth.html")) {
        return target.pathname + target.search + target.hash;
      }
    } catch {}
  }
  return "dashboard.html";
}
function showMessage(message, type = "success") {
  const el = $("message");
  el.textContent = message;
  el.className = "message show " + type;
}
function clearMessage() {
  $("message").className = "message";
  $("message").textContent = "";
}
function setMode(nextMode) {
  mode = nextMode;
  const signup = mode === "signup";
  $("loginTab").classList.toggle("active", !signup);
  $("signupTab").classList.toggle("active", signup);
  $("heading").textContent = signup ? "Create your account" : "Welcome back";
  $("subtitle").textContent = signup ? "Join FundedEdge to save favorites and share reviews." : "Log in to access your FundedEdge account.";
  $("nameField").hidden = !signup;
  $("countryField").hidden = !signup;
  $("fullName").required = signup;
  $("password").autocomplete = signup ? "new-password" : "current-password";
  $("submitButton").textContent = signup ? "Create account" : "Log in";
  $("forgotButton").hidden = signup;
  clearMessage();
  if (signup) resetCountryPicker();
}
function showAccount(user) {
  $("authPanel").hidden = true;
  $("accountPanel").hidden = false;
  $("accountEmail").textContent = user.email || "Signed in";
  const country = user.user_metadata?.country;
  if (country) {
    const found = COUNTRIES.find(c => c.code === country);
    $("accountCountry").textContent = "Country: " + (found ? found.name : country);
  } else {
    $("accountCountry").textContent = "";
  }
}
function showAuth() {
  $("authPanel").hidden = false;
  $("accountPanel").hidden = true;
}
function friendlyError(error) {
  const msg = error?.message || "Something went wrong. Please try again.";
  if (/invalid login credentials/i.test(msg)) return "Email or password is incorrect. If you just registered, confirm your email first.";
  if (/email not confirmed/i.test(msg)) return "Please confirm your email using the link we sent you.";
  if (/already registered/i.test(msg)) return "This email already has an account. Try logging in instead.";
  if (/rate limit/i.test(msg)) return "Too many attempts. Please wait a moment and try again.";
  return msg;
}

/* ============ COUNTRY PICKER LOGIC ============ */
const countryPicker = document.querySelector(".country-picker");
const countrySearch = $("countrySearch");
const countryResults = $("countryResults");
const countryHidden = $("country");
let countryHighlight = -1;
let filteredCountries = COUNTRIES;

function resetCountryPicker() {
  countrySearch.value = "";
  countryHidden.value = "";
  countrySearch.readOnly = true;
  countryPicker.classList.remove("open");
  countryResults.innerHTML = "";
  countryHighlight = -1;
  filteredCountries = COUNTRIES;
}

function renderCountryResults(list) {
  filteredCountries = list;
  if (!list.length) {
    countryResults.innerHTML = `<div class="country-no-match">No countries found</div>`;
    return;
  }
  countryResults.innerHTML = list.map((c, i) =>
    `<div class="country-result${i === countryHighlight ? " highlight" : ""}${c.code === countryHidden.value ? " selected" : ""}" data-code="${c.code}">${c.name}</div>`
  ).join("");
}

function openCountryPicker() {
  countrySearch.readOnly = false;
  countryPicker.classList.add("open");
  const q = countrySearch.value.toLowerCase().trim();
  const list = q ? COUNTRIES.filter(c => c.name.toLowerCase().includes(q)) : COUNTRIES;
  countryHighlight = -1;
  renderCountryResults(list);
  if (list.length && !q) {
    const sel = countryResults.querySelector(".selected");
    if (sel) sel.scrollIntoView({ block: "nearest" });
  }
}

function closeCountryPicker() {
  countrySearch.readOnly = true;
  countryPicker.classList.remove("open");
  countryHighlight = -1;
}

function selectCountry(country) {
  countryHidden.value = country.code;
  countrySearch.value = country.name;
  closeCountryPicker();
  countrySearch.blur();
}

countrySearch.addEventListener("focus", openCountryPicker);
countrySearch.addEventListener("click", openCountryPicker);

countrySearch.addEventListener("input", () => {
  const q = countrySearch.value.toLowerCase().trim();
  const list = q ? COUNTRIES.filter(c => c.name.toLowerCase().includes(q)) : COUNTRIES;
  countryHighlight = -1;
  renderCountryResults(list);
});

countrySearch.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") {
    e.preventDefault();
    countryHighlight = Math.min(countryHighlight + 1, filteredCountries.length - 1);
    renderCountryResults(filteredCountries);
    countryResults.querySelector(".highlight")?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    countryHighlight = Math.max(countryHighlight - 1, 0);
    renderCountryResults(filteredCountries);
    countryResults.querySelector(".highlight")?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (countryHighlight >= 0 && filteredCountries[countryHighlight]) {
      selectCountry(filteredCountries[countryHighlight]);
    } else if (filteredCountries.length === 1) {
      selectCountry(filteredCountries[0]);
    }
  } else if (e.key === "Escape") {
    closeCountryPicker();
    countrySearch.blur();
  }
});

countryResults.addEventListener("click", (e) => {
  const row = e.target.closest(".country-result");
  if (!row) return;
  const country = COUNTRIES.find(c => c.code === row.dataset.code);
  if (country) selectCountry(country);
});

document.addEventListener("click", (e) => {
  if (!countryPicker.contains(e.target)) closeCountryPicker();
});

resetCountryPicker();

/* ============ AUTH FLOW ============ */
$("loginTab").addEventListener("click", () => setMode("login"));
$("signupTab").addEventListener("click", () => setMode("signup"));

$("authForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (busy) return;

  const email = $("email").value.trim();
  const password = $("password").value;
  const fullName = $("fullName").value.trim();
  const country = countryHidden.value;

  if (password.length < 8) { showMessage("Please use a password with at least 8 characters.", "error"); return; }
  if (mode === "signup" && !fullName) { showMessage("Please enter your name.", "error"); return; }
  if (mode === "signup" && !country) { showMessage("Please select your country.", "error"); return; }

  busy = true;
  $("submitButton").disabled = true;
  $("submitButton").textContent = "Please wait…";
  clearMessage();

  try {
    if (mode === "signup") {
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName, country: country },
          emailRedirectTo: location.origin + location.pathname
        }
      });
      if (error) throw error;
      if (data.session && data.user) {
        location.assign(getNextUrl());
      } else {
        showMessage("Account created! Check your inbox and spam folder, then click the verification link before logging in.");
      }
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      if (!data.user?.email_confirmed_at) {
        await db.auth.signOut();
        showMessage("Please verify your email before continuing.", "error");
        return;
      }
      location.assign(getNextUrl());
    }
  } catch (error) {
    showMessage(friendlyError(error), "error");
  } finally {
    busy = false;
    $("submitButton").disabled = false;
    $("submitButton").textContent = mode === "signup" ? "Create account" : "Log in";
  }
});

$("forgotButton").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) { showMessage("Enter your email address first.", "error"); $("email").focus(); return; }
  try {
    const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) throw error;
    showMessage("If an account exists for that email, a password-reset link will be sent.");
  } catch (error) { showMessage(friendlyError(error), "error"); }
});

$("continueButton").addEventListener("click", () => location.assign(getNextUrl()));

$("logoutButton").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();
  if (error) {
    $("accountMessage").textContent = error.message;
    $("accountMessage").className = "message show error";
    return;
  }
  showAuth(); setMode("login");
  showMessage("You have logged out successfully.");
});

const requestedMode = params.get("mode");
if (requestedMode === "signup" || requestedMode === "signin") {
  setMode(requestedMode === "signup" ? "signup" : "login");
}

const { data: { session } } = await db.auth.getSession();
if (session?.user?.email_confirmed_at) {
  showAccount(session.user);
} else {
  showAuth();
  if (params.get("verified") === "1") {
    showMessage("Email verification complete. Please log in to continue.");
  }
}

db.auth.onAuthStateChange((_event, session) => {
  if (session?.user?.email_confirmed_at) showAccount(session.user);
  else showAuth();
});
</script>
