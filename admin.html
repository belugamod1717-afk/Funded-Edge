
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FundedEdge Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; background: #06100d;
      color: #f2f7f5; font-family: Arial, sans-serif;
      padding: 20px;
    }
    .panel {
      width: 100%; max-width: 400px; padding: 28px;
      background: #0b1b16; border: 1px solid #24473b;
      border-radius: 18px;
    }
    h1 { color: #27d17f; }
    input, button {
      width: 100%; padding: 14px; margin-top: 12px;
      border-radius: 9px; font-size: 16px;
    }
    input {
      background: #06100d; border: 1px solid #24473b;
      color: white;
    }
    button {
      border: 0; background: #27d17f;
      font-weight: bold; cursor: pointer;
    }
    #message { line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>FundedEdge</h1>
    <h2>Admin login test</h2>
    <p>This checks the old demo login only.</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Email"
        autocomplete="username" required>
      <input id="password" type="password" placeholder="Password"
        autocomplete="current-password" required>
      <button type="submit">Test Login</button>
    </form>

    <p id="message" role="status">Ready.</p>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (email === "admin@fundededge.com" &&
          password === "FundedEdge123!") {
        message.textContent =
          "Demo credentials accepted. This is only a login test; secure admin authentication is not configured.";
      } else {
        message.textContent =
          "These credentials do not match the demo login.";
      }
    });
  </script>
</body>
</html>
